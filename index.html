<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>עולם הטרולים</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7fdcff">
<link rel="icon" type="image/png" sizes="192x192" href="assets/app/icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script id="pwa">
// The installed app (Add to Home Screen, the Android package): sw.js lets it start without a network. Never on a file,
// on this computer or in a test or demo address: there the page must come straight from the disk or the server.
// The viewport has no viewport-fit=cover on purpose: without it the phone itself keeps the page clear of the notch and of the home bar.
(function () {
  if (!('serviceWorker' in navigator) || location.protocol !== 'https:' || /^(localhost|127\.|\[::1\])/.test(location.hostname) || /demo|auto|fit/.test(location.hash || '')) return;
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
      setTimeout(function () { // the pictures of a first visit were loaded before the worker took charge: it saves them now
        try { reg.active.postMessage({ seen: performance.getEntriesByType('resource').map(function (x) { return x.name; }) }); } catch (e) {}
      }, 5000);
    }).catch(function () {});
  });
})();
</script>
<link rel="preload" href="assets/font/rubik-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Rubik";src:url(assets/font/rubik-hebrew.woff2) format("woff2");font-weight:400 800;font-style:normal;font-display:swap;unicode-range:U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:"Rubik";src:url(assets/font/rubik-latin.woff2) format("woff2");font-weight:400 800;font-style:normal;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Rubik","Varela Round","Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body{background:linear-gradient(#6fcbff 0%,#b9e8ff 45%,#eafbd6 78%,#a8e58a 100%);color:#3b2a55}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}

/* ---------- background ---------- */
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.sun{position:absolute;top:-60px;left:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#fff6b0 0 38%,#ffd84d 40% 52%,transparent 54%);animation:spin 40s linear infinite}
.sun:before{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(transparent 58%,rgba(255,236,150,.55) 60%,transparent 72%);animation:pulse 3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.cloud{position:absolute;left:0;width:150px;height:50px;background:#fff;border-radius:60px;opacity:.9;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:66px;height:66px;top:-32px;left:22px}
.cloud:after{width:84px;height:84px;top:-44px;right:20px}
@keyframes drift{from{transform:translateX(-35vw)}to{transform:translateX(135vw)}}
.mote{position:absolute;bottom:-20px;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 12px #fff;animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}50%{transform:translate(30px,-50vh) scale(1)}100%{transform:translate(-20px,-105vh) scale(.5);opacity:0}}
.fly{position:absolute;font-size:34px;animation:flutter linear infinite}
@keyframes flutter{0%{transform:translate(-10vw,0) rotate(8deg)}25%{transform:translate(25vw,-8vh) rotate(-10deg)}50%{transform:translate(55vw,4vh) rotate(10deg)}75%{transform:translate(85vw,-10vh) rotate(-8deg)}100%{transform:translate(115vw,0) rotate(8deg)}}
.hills{position:absolute;bottom:0;left:0;width:100%;height:24vh}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.conf{position:absolute;top:-20px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(var(--r))}}
.spark{position:fixed;font-size:26px;line-height:1;pointer-events:none;color:#ffd23f;text-shadow:0 0 6px #fff}

/* ---------- screens ---------- */
#app{position:fixed;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.6vmin,16px);padding:clamp(8px,2vmin,20px);overflow-y:auto;overflow-x:hidden;animation:scrIn .5s cubic-bezier(.2,1.3,.4,1) both}
.screen.out{animation:scrOut .3s ease-in both;pointer-events:none}
@keyframes scrIn{from{opacity:0;transform:translateY(50px) scale(.92)}to{opacity:1;transform:none}}
@keyframes scrOut{to{opacity:0;transform:translateY(-40px) scale(1.05)}}
.top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px;flex:0 0 auto}
.chips{display:flex;gap:8px;align-items:center}
.chip{background:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:clamp(16px,2.6vmin,24px);box-shadow:0 4px 0 rgba(59,42,85,.15);white-space:nowrap}
.chip.bump{animation:pop .45s}
.icon{width:64px;height:64px;border-radius:50%;background:#fff;font-size:28px;box-shadow:0 4px 0 rgba(59,42,85,.18);transition:transform .12s}
.icon:active,.btn:active,.ans:active,.opt:active{transform:translateY(4px) scale(.96)}
.btn{min-height:68px;padding:10px 30px;border-radius:999px;font-weight:700;font-size:clamp(20px,3.6vmin,32px);color:#fff;background:linear-gradient(#ff7ab8,#ff4f9a);box-shadow:0 7px 0 #c92f74,0 12px 18px rgba(0,0,0,.18);transition:transform .12s;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.btn.b2{background:linear-gradient(#b99bff,#8e5cff);box-shadow:0 7px 0 #6337cf,0 12px 18px rgba(0,0,0,.18)}
.btn.b3{background:linear-gradient(#ffd66b,#ffb300);box-shadow:0 7px 0 #cf8a00,0 12px 18px rgba(0,0,0,.18)}
.btn.big{font-size:clamp(28px,5.5vmin,48px);min-height:92px;padding:12px 54px;animation:pulse 1.6s ease-in-out infinite}
.btn.wig{animation:wiggle 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.06)}}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.shake{animation:shake .45s}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}

/* ---------- troll ---------- */
.troll{width:100%;height:auto;display:block;overflow:visible}
.troll .tb{animation:idle 2.2s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%;transform-box:fill-box}
.troll .hair{animation:sway 3s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%;transform-box:fill-box}
.troll .eyes{animation:blink 4.2s infinite;animation-delay:var(--d,0s);transform-origin:50% 50%;transform-box:fill-box}
.troll .arm{fill:none;stroke-linecap:round;stroke-width:15}
.troll.cheer .tb{animation:jump .55s ease-in-out infinite}
.troll.cheer .hair{animation-duration:.55s}
.troll.cheer .armL{animation:waveL .28s ease-in-out infinite alternate;transform-origin:100% 100%;transform-box:fill-box}
.troll.cheer .armR{animation:waveR .28s ease-in-out infinite alternate;transform-origin:0 100%;transform-box:fill-box}
.troll.think .tb{animation:tilt 1.6s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0) scale(1.03,.97)}50%{transform:translateY(-7px) scale(.98,1.03)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1.08,.9)}45%{transform:translateY(-34px) scale(.94,1.08)}}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes waveL{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
@keyframes waveR{from{transform:rotate(14deg)}to{transform:rotate(-12deg)}}

/* ---------- home ---------- */
.title{margin:0;font-size:clamp(40px,10vmin,96px);font-weight:700;color:#fff;-webkit-text-stroke:3px #8e5cff;paint-order:stroke fill;text-shadow:0 6px 0 #6337cf,0 12px 20px rgba(0,0,0,.2);line-height:1.1;text-align:center}
.title span{display:inline-block;animation:wave 1.8s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
.village{flex:1 1 auto;width:100%;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;align-items:flex-end;gap:clamp(4px,1.5vmin,18px);padding-bottom:2vh;min-height:150px}
.vt{width:clamp(84px,17vmin,150px);background:none;padding:0;text-align:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.vt.sm{width:clamp(64px,11vmin,100px)}
.vt b{display:block;font-size:clamp(12px,2vmin,17px);background:rgba(255,255,255,.85);border-radius:999px;padding:2px 6px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guide{display:flex;align-items:center;gap:12px;max-width:640px}
.guide .g{width:clamp(130px,26vmin,210px);flex:0 0 auto}
.bubble{background:#fff;border-radius:26px;padding:14px 20px;font-weight:700;font-size:clamp(18px,3.2vmin,28px);box-shadow:0 6px 0 rgba(59,42,85,.14);position:relative;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}

/* ---------- round ---------- */
.path{display:flex;gap:clamp(4px,1.2vmin,12px);align-items:center;justify-content:center;flex:0 0 auto}
.node{width:clamp(26px,5.4vmin,46px);height:clamp(26px,5.4vmin,46px);border-radius:50%;background:radial-gradient(circle at 36% 30%,#fff8e4,#e9d5a6 75%);box-shadow:inset 0 0 0 2px rgba(122,79,37,.4),0 2px 0 rgba(90,60,20,.3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(13px,2.6vmin,22px);color:#8a6a3c;transition:transform .3s,background .3s}
.node.done{background:radial-gradient(circle at 36% 30%,#fffdf6,#f6e9c8 75%);animation:pop .5s}
.node.cur{background:#ffd23f;color:#fff;transform:scale(1.25);box-shadow:inset 0 0 0 2px rgba(122,79,37,.4),0 0 0 6px rgba(255,210,63,.35);animation:pulse 1s ease-in-out infinite}
.qrow{display:flex;align-items:center;gap:clamp(8px,2vmin,24px);width:100%;max-width:920px;flex:0 0 auto}
.buddy{width:clamp(100px,21vmin,190px);flex:0 0 auto}
.qside{flex:1 1 auto;display:flex;flex-direction:column;gap:10px;min-width:0}
.qcard{background:#fff;border-radius:32px;padding:clamp(10px,2.4vmin,26px);text-align:center;font-weight:700;font-size:clamp(40px,10vmin,92px);box-shadow:0 8px 0 rgba(59,42,85,.14);animation:qIn .5s cubic-bezier(.2,1.4,.4,1) both;line-height:1.15}
.qcard.txt{font-size:clamp(22px,4.6vmin,42px)}
.qcard .box{display:inline-block;min-width:1.1em;border:5px dashed #ff4f9a;border-radius:16px;color:#ff4f9a;padding:0 .12em;animation:pulse 1.2s infinite}
@keyframes qIn{from{opacity:0;transform:translateX(-70px) rotate(-5deg) scale(.8)}to{opacity:1;transform:none}}
.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(8px,2vmin,18px);width:100%;max-width:920px;flex:0 0 auto}
@media (min-aspect-ratio:5/4){.answers{grid-template-columns:repeat(4,1fr)}}
.ans{min-height:clamp(72px,14vmin,124px);border-radius:28px;font-weight:700;font-size:clamp(32px,7vmin,62px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform .12s,opacity .3s,filter .3s;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.ans.c0{background:#ff6fae;box-shadow:0 8px 0 #c93f7f}.ans.c1{background:#5bb8ff;box-shadow:0 8px 0 #2f84c9}
.ans.c2{background:#ffb83d;box-shadow:0 8px 0 #cf8a00}.ans.c3{background:#a57bff;box-shadow:0 8px 0 #6f45cf}
.ans:nth-child(2){animation-delay:.07s}.ans:nth-child(3){animation-delay:.14s}.ans:nth-child(4){animation-delay:.21s}
.ans.right{background:#34c759;box-shadow:0 8px 0 #1f8f3c;animation:win .7s cubic-bezier(.2,1.4,.4,1)}
.ans.wrong{animation:shake .45s;opacity:.35;filter:grayscale(.8)}
.ans.off{opacity:.45}
@keyframes win{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-4deg)}70%{transform:scale(.95) rotate(3deg)}100%{transform:scale(1.08)}}
.hint{width:100%;max-width:920px;background:rgba(255,255,255,.92);border-radius:24px;padding:10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(59,42,85,.12);animation:pop .5s cubic-bezier(.2,1.4,.4,1);flex:0 0 auto}
.hint .cap{font-weight:700;font-size:clamp(15px,2.6vmin,22px);text-align:center}
.hint .vis{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;direction:ltr;font-weight:700;font-size:28px}
.num{display:flex;flex-direction:column;align-items:center;gap:3px}
.num .g{display:flex;align-items:flex-end;gap:4px}
.num .lbl{font-size:18px;font-weight:700}
.dots{display:grid;grid-template-columns:repeat(5,auto);gap:3px}
.dot{width:clamp(11px,2.1vmin,17px);height:clamp(11px,2.1vmin,17px);border-radius:50%;background:#5bb8ff;animation:pop .4s both}
.dot.p{background:#ff6fae}.dot.x{background:#ddd;position:relative}.dot.x:after{content:"✕";position:absolute;inset:0;font-size:10px;line-height:1;display:flex;align-items:center;justify-content:center;color:#e0457b}
.dot.e{background:none;border:3px dashed #ff6fae}
.rod{width:clamp(9px,1.6vmin,13px);height:clamp(48px,9vmin,70px);border-radius:4px;background:repeating-linear-gradient(#5bb8ff 0 9%,#2f84c9 9% 10%);animation:pop .4s both}
.rod.p{background:repeating-linear-gradient(#ff6fae 0 9%,#c93f7f 9% 10%)}
.grp{display:flex;gap:3px;padding:3px 6px;border-radius:999px;background:#eef6ff;margin:1px}
.groups{display:flex;flex-direction:column;align-items:center}

/* ---------- end ---------- */
.h2{margin:0;font-size:clamp(28px,6.5vmin,60px);font-weight:700;color:#fff;-webkit-text-stroke:2px #ff4f9a;paint-order:stroke fill;text-shadow:0 5px 0 #c92f74;text-align:center}
.stars{display:flex;gap:4px;direction:ltr;flex-wrap:wrap;justify-content:center}
.star{font-size:clamp(28px,6.4vmin,58px);line-height:1;color:#d9d3e6;opacity:0;animation:starIn .5s cubic-bezier(.2,1.6,.4,1) forwards}
.star.on{color:#ffc61a;text-shadow:0 3px 0 #d99400,0 0 16px rgba(255,220,90,.9)}
@keyframes starIn{from{opacity:0;transform:scale(0) rotate(-90deg)}to{opacity:1;transform:none}}
.stage{width:clamp(170px,36vmin,290px);min-height:clamp(200px,42vmin,340px);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.egg{width:74%;cursor:pointer;animation:wob 1.1s ease-in-out infinite;transform-origin:50% 90%;overflow:visible}
.egg .crack{opacity:0}
.egg.hatching{animation:hatch .7s ease-in forwards}
.egg.hatching .crack{opacity:1}
@keyframes wob{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg) scale(1.04)}}
@keyframes hatch{0%{transform:rotate(-10deg)}15%{transform:rotate(10deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(12deg)}60%{transform:rotate(-12deg) scale(1.1)}80%{transform:scale(1.3);opacity:1}100%{transform:scale(1.7);opacity:0}}
.reveal{width:100%;animation:reveal .9s cubic-bezier(.2,1.5,.4,1) both}
@keyframes reveal{from{transform:scale(0) rotate(-200deg);opacity:0}to{transform:none;opacity:1}}
.banner{background:#fff;border-radius:999px;padding:8px 22px;font-weight:700;font-size:clamp(18px,3.4vmin,30px);box-shadow:0 5px 0 rgba(59,42,85,.14);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;text-align:center}
.gift{font-size:clamp(120px,34vmin,240px);line-height:1;background:none;animation:wob 1s ease-in-out infinite;transform-origin:50% 90%}
.gift.open{animation:hatch .7s ease-in forwards}

/* ---------- dress-up ---------- */
.dwrap{display:flex;gap:clamp(10px,3vmin,30px);width:100%;max-width:980px;flex:1 1 auto;align-items:center;justify-content:center;flex-wrap:wrap}
.dprev{display:flex;flex-direction:column;align-items:center;gap:6px}
.dprev .nav{display:flex;align-items:center;gap:8px}
.prev{width:clamp(150px,32vmin,270px)}
.dpanel{flex:1 1 320px;max-width:560px;background:rgba(255,255,255,.92);border-radius:28px;padding:12px;box-shadow:0 8px 0 rgba(59,42,85,.12)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;min-height:64px;border-radius:18px;background:#efe8ff;font-weight:700;font-size:clamp(14px,2.4vmin,20px);transition:transform .12s}
.tab.on{background:#8e5cff;color:#fff;transform:translateY(-3px)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px}
.opt{position:relative;min-height:78px;border-radius:20px;background:#f6f2ff;padding:6px;border:4px solid transparent;transition:transform .12s;animation:pop .4s both}
.opt.sel{border-color:#ff4f9a;background:#fff0f7}
.opt.locked>:first-child{opacity:.3;filter:grayscale(1)}
.opt .sw{display:block;width:52px;height:52px;border-radius:50%;margin:auto;box-shadow:inset 0 -5px 0 rgba(0,0,0,.15)}
.opt .lock{position:absolute;inset:auto 0 6px 0;font-size:13px;font-weight:700}
.dmsg{min-height:26px;font-weight:700;text-align:center;margin-top:8px;color:#c92f74}

/* ---------- topic picker ---------- */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,200px),1fr));gap:clamp(6px,1.4vmin,12px);width:100%;max-width:1040px;flex:0 0 auto}
.world{background:rgba(255,255,255,.93);border-radius:22px;box-shadow:0 6px 0 rgba(59,42,85,.13);padding:6px;display:flex;flex-direction:column;gap:5px;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;min-width:0}
.wgo{display:flex;align-items:center;gap:8px;background:linear-gradient(#fff3fa,#ffe1f0);border-radius:17px;min-height:clamp(50px,9vmin,72px);padding:4px 10px;text-align:start;width:100%;transition:transform .12s}
.wgo:active,.step:active{transform:scale(.94)}
.wgo.mixgo{background:linear-gradient(#fff6d6,#ffe39a);flex:1}
.wgo .ic{font-size:clamp(26px,5vmin,42px);flex:0 0 auto}
.wgo b{display:block;font-size:clamp(14px,2.5vmin,21px);line-height:1.15}
.wgo small{display:block;font-size:clamp(11px,1.8vmin,14px);opacity:.8;line-height:1.15}
.wrow{display:flex;align-items:center;gap:4px}
.step{width:clamp(38px,6.5vmin,50px);height:clamp(38px,6.5vmin,50px);border-radius:50%;background:#efe8ff;font-size:24px;font-weight:700;flex:0 0 auto;line-height:1;transition:transform .12s}
.winfo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:clamp(11px,1.8vmin,14px);font-weight:700}
.grade{border-radius:99px;padding:1px 9px;color:#fff;background:#2fae4f;white-space:nowrap}
.grade.g3{background:#8e5cff}
.wbar{display:flex;gap:3px;direction:ltr}
.wbar i{width:12px;height:7px;border-radius:4px;background:#e4def2}
.wbar i.g3{background:#efe8ff;box-shadow:inset 0 0 0 1.5px #b99bff}
.wbar i.on{background:#2fae4f;box-shadow:none}
.wbar i.g3.on{background:#8e5cff}
.note{font-size:clamp(11px,1.8vmin,14px);background:rgba(255,255,255,.8);border-radius:16px;padding:4px 14px;text-align:center;flex:0 0 auto}
.chip.lv{font-size:clamp(12px,2.1vmin,17px);padding:4px 14px;white-space:normal;text-align:center;flex:0 0 auto}
.qcard{white-space:nowrap;overflow:hidden}
.qcard.txt{white-space:normal}
.qcard.med{font-size:clamp(26px,6.5vmin,60px)}
.icon.dim{opacity:.4}
.banners{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;flex:0 0 auto}
.banner.prize{display:flex;align-items:center;gap:8px}
.pz{width:clamp(40px,7vmin,60px);flex:0 0 auto}
/* ---------- fit every screen: phones, tablets, laptops ---------- */
.top{flex-wrap:wrap}
.buddy{width:clamp(70px,19vmin,190px)}
.stage{width:clamp(96px,22vmin,240px);min-height:clamp(120px,27vmin,290px)}
.prev{width:clamp(110px,27vmin,250px)}

/* ---- race between online players: invitation bar, launch, track at the bottom, results ---- */

/* a race is on: an orange frame around the whole page, fading towards the middle */
#frame{display:none}

#frame i{position:fixed;z-index:46;pointer-events:none}
#frame i:nth-child(1){left:0;right:0;top:0;height:16px;background:linear-gradient(rgba(255,138,0,.9),rgba(255,138,0,0))}

#track{position:fixed;left:0;right:0;bottom:0;height:var(--trk);z-index:45;background:#fff;box-shadow:0 -4px 0 rgba(59,42,85,.14);display:flex;align-items:center;gap:6px;padding:0 8px;direction:rtl}

@keyframes trWaveR{0%,100%{transform:rotate(0) scaleY(1)}18%,46%,74%{transform:rotate(-128deg) scaleY(1.6)}32%,60%{transform:rotate(-100deg) scaleY(1.6)}}

[class*="tr-"] .troll{overflow:visible}
.tr-wave .troll .armR,.tr-big .troll .armR{transform-box:fill-box;transform-origin:0 0;animation:trWaveR .9s ease-in-out 1}
.tr-big .troll .armL{transform-box:fill-box;transform-origin:100% 0;animation:trWaveL .9s ease-in-out 1}

.endm.fin .mbud[class*="tr-"] .troll .hair{animation:sway 3s ease-in-out infinite}

/* TOY-BEGIN ================= the skin "the toy island" (body.toy, chosen by &skin=toy; docs/prompts/reskin-spec.md) =================
   Only colours, pictures and the ground: no size, grid or text is changed here. Every selector starts with body.toy, so the
   parchment skin is untouched. Part 1: the world layer and the world screens (camp, lands, world map, map of a topic, end screens, journal). */
body.toy{--ti:#3b2a55;--tp:#fff;--tc:#fff8e6;--te:#c9b9ea;--te2:#b9a6e6;--tsh:rgba(59,42,85,.18);--tgold:#ffd23f;--tpink:#ff4f9a;--tpip:#e4e0ee;--tpipon:#ffb300;--tpath:#fff1c4;--tbed:rgba(170,110,30,.6);--tdot:#ff8a3d;
  --tmain:linear-gradient(#d6266f,#c2185f);--tmaine:#8f1148;--tnext:linear-gradient(#1f8a43,#1b8038);--tnexte:#125a27;
  --hz:27%;--s0:#7fdcff;--s1:#c8f3ff;--w0:#27b4ea;--w1:#0b78c6;--g0:#c9f27a;--g1:#8fe05a;--g2:#5fcb49;--g3:#49b943;--sand:#f6d27a;--sand2:#dba94a;--veil:rgba(255,255,255,0);
  --sky:linear-gradient(to bottom,var(--s0) 0,var(--s1) var(--hz),var(--w0) calc(var(--hz) + .4%),var(--w1) 100%);
  /* the island: one recipe (grass lit from the top left, a rim of sand, its shadow on the water) */
  --isle:radial-gradient(120% 90% at 30% 0,var(--g0) 0,var(--g1) 35%,var(--g2) 75%,var(--g3) 100%);
  --isin:inset 0 10px 0 rgba(255,255,255,.35),inset 0 -12px 0 rgba(30,120,40,.25);
  --rim:0 14px 0 var(--sand),0 26px 0 var(--sand2),0 34px 0 rgba(0,70,130,.35),0 50px 40px rgba(0,60,120,.3);
  --rims:0 6px 0 var(--sand),0 11px 0 var(--sand2),0 15px 0 rgba(0,70,130,.35);
  /* ONE shadow recipe: the hard edge under a picture, and the soft ellipse on the ground, a little to the right (the light is at the top left) */
  --osh:drop-shadow(0 3px 0 rgba(0,0,0,.12));
  --gsh:radial-gradient(closest-side,rgba(20,80,40,.42),rgba(20,80,40,.2) 55%,transparent) 100% 100%/86% 24% no-repeat;
  --gsea:radial-gradient(closest-side,rgba(0,70,140,.3),transparent) 100% 100%/86% 24% no-repeat;
  --gtr:radial-gradient(closest-side,rgba(20,80,40,.4),rgba(20,80,40,.18) 55%,transparent) 56% 100%/82% 11% no-repeat;
  background:var(--w1)}
@media (max-width:640px),(max-height:520px){body.toy{--isin:inset 0 6px 0 rgba(255,255,255,.35),inset 0 -8px 0 rgba(30,120,40,.25);--rim:0 8px 0 var(--sand),0 15px 0 var(--sand2),0 20px 0 rgba(0,70,130,.35),0 30px 24px rgba(0,60,120,.3)}}
body.toy[data-k="calm"]{--hz:80%;--veil:rgba(255,255,255,.3)}
body.toy[data-k="panel"]{--hz:70%;--veil:rgba(255,255,255,.18)}
@media (orientation:landscape){body.toy[data-k="calm"]{--hz:74%}}
body.toy.dusk{--g0:#d6e874;--g1:#9fd456;--g2:#6dbd49;--g3:#52a744;--sand:#f3c573;--sand2:#d29a46;--w0:#5f86c8;--w1:#2f5aa8;
  --sky:linear-gradient(to bottom,#ff9a62 0,#ffc78a calc(var(--hz)*.6),#ffe9bf var(--hz),#f2a57c calc(var(--hz) + .4%),#5f86c8 calc(var(--hz) + 16%),#2f5aa8 100%)}
body.toy.night{--s0:#141d4f;--s1:#2b3a80;--w0:#1d3f8f;--w1:#0c2260;--g0:#6fbf86;--g1:#4aa373;--g2:#368a63;--g3:#2a7557;--sand:#b9a77e;--sand2:#8f7c5a;--tbed:rgba(20,40,60,.5);--veil:rgba(20,28,80,0)}
/* ---- the world layer: #bg, under every screen, never takes a tap ---- */
body.toy #bg{background:var(--sky)}
body.toy #bg::before{content:"";position:absolute;left:0;right:0;top:var(--hz);bottom:0;pointer-events:none;
  background:radial-gradient(60px 16px at 20% 30%,rgba(255,255,255,.45),transparent 70%),radial-gradient(80px 18px at 78% 12%,rgba(255,255,255,.4),transparent 70%),radial-gradient(70px 16px at 55% 96%,rgba(255,255,255,.35),transparent 70%),radial-gradient(50px 12px at 8% 80%,rgba(255,255,255,.35),transparent 70%),radial-gradient(60px 14px at 94% 62%,rgba(255,255,255,.35),transparent 70%)}
body.toy #bg::after{content:"";position:absolute;inset:0;pointer-events:none;background:var(--veil)}
body.toy.night #bg::before{opacity:.35}
body.toy .tsun{position:absolute;left:4%;top:9%;width:clamp(64px,13vmin,120px);height:auto;filter:var(--osh)}
body.toy.dusk .tsun{top:calc(var(--hz) - 13%);filter:saturate(1.3) hue-rotate(-18deg) drop-shadow(0 0 18px rgba(255,150,60,.8))}
body.toy .tcloud{position:absolute;left:62%;top:5%;width:clamp(70px,15vmin,150px);height:auto;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08))}
body.toy .tcloud.c2{left:24%;top:13%}
body.toy.night .tcloud{opacity:.28}
body.toy #bg .nsky{inset:0 0 auto 0;height:var(--hz)}
body.toy #bg .isle{display:none;position:absolute;border-radius:46% 54% 44% 56%/16% 14% 12% 12%;background:var(--isle);box-shadow:var(--isin),var(--rim)}
body.toy[data-k="calm"] #bg .isle{display:block;left:-10%;right:-10%;top:90%;bottom:-30%}
body.toy[data-k="panel"] #bg .isle{display:block;left:-10%;right:-10%;top:86%;bottom:-30%}
@media (orientation:landscape){body.toy[data-k="calm"] #bg .isle{left:-6%;right:-6%;top:84%}}
@media (max-width:640px),(max-height:520px){body.toy .tcloud.c2{display:none}}
/* ---- every world screen: no parchment; each screen is a layer of its own, so its island (z-index:-1) lies over the world and under its content ---- */
body.toy .screen{z-index:0}
body.toy .screen.rmap,body.toy .screen.map{background:none}
body.toy img[src^="assets/toy/"]{object-fit:contain;object-position:50% 100%}
body.toy .top .chip,body.toy .top .icon{box-shadow:0 4px 0 var(--te2)}
body.toy .rmap .h2,body.toy .camp .title{color:var(--ti);background:var(--tp);box-shadow:0 4px 0 var(--te)}
body.toy .rmsg,body.toy .map .note{background:#fff}
/* ---- the map of a topic and the world map ---- */
body.toy .tmap::before{content:"";position:absolute;inset:-6px -4px 16px;z-index:-1;pointer-events:none;border-radius:46% 54% 44% 56%/16% 14% 12% 12%;background:var(--isle);box-shadow:var(--isin),var(--rim)}
@media (min-width:641px) and (min-height:521px){body.toy .tmap::before{inset:-10px -8px 30px}}
body.toy .mdeco{left:50%;top:50%;opacity:1;transform:translate(-50%,-100%);height:auto;background:var(--gsh);padding-bottom:.4%;filter:var(--osh)}
body.toy .mdeco.sea{left:9%;top:6%;z-index:-1;background:var(--gsea)}
@media (max-width:640px),(max-height:520px){body.toy .tmap .mnode .mic>img:first-child{transform:scale(1.18);transform-origin:50% 100%}}
body.toy.night .deco{filter:brightness(.72) saturate(.85)}
@media (max-width:640px),(max-height:520px){body.toy .mdeco.dw{display:none}}
body.toy .mtrail path{stroke:#fff;stroke-width:calc(7.5px*var(--s));stroke-dasharray:.1 calc(15px*var(--s));opacity:.92}
body.toy .mtrail path.tbed{stroke:var(--tbed);stroke-width:calc(22px*var(--s));stroke-dasharray:none;opacity:1}

body.toy .ans.pic.c2{box-shadow:inset 0 0 0 5px #b25e00,0 8px 0 #7a3f00}body.toy .ans.pic.c3{box-shadow:inset 0 0 0 5px #7a4ae0,0 8px 0 #4f2ba6}

/* PAD-BEGIN ================= the calculation sheet (task "pad", docs/prompts/pad-spec.md) =================
   A cream page in the look of the toy island, self-contained: it uses only the dimmed layer .ovl, none of the rules of the generic
   overlay card. All sizes come from fitPad() as variables: --u a cell, --s a small cell, --k a key, --kc keys in a row. */
.padc{--u:40px;--s:26px;--k:48px;--kc:6;--p:10px;--g:8px;flex:0 0 auto;display:flex;flex-direction:column;justify-items:center;align-items:center;gap:var(--g);padding:var(--p);max-width:100%;max-height:100%;overflow:hidden;direction:ltr;color:#3b2a55;font-weight:700;background:#fff8e6;border-radius:24px;box-shadow:inset 0 0 0 3px #fff,0 6px 0 #c9b9ea,0 14px 24px rgba(30,20,60,.3)}
.padc>*{flex-shrink:0}
.padc.sd{display:grid;grid-template-columns:auto auto;grid-template-areas:"h h" "m k";column-gap:12px}
.padc.sh{grid-template-areas:"m h" "m k";grid-template-rows:auto 1fr}
.padc.sh .padk{align-self:start}
.padh{grid-area:h;justify-self:stretch;align-self:stretch;flex:0 0 auto;display:flex;align-items:center;gap:8px;height:48px;direction:rtl}
.padh b{flex:1 1 auto;min-width:0;font-size:clamp(15px,2.6vmin,21px);line-height:1.15;color:#7a4fe0;padding-inline-start:6px}
.padc.sh .padh b{font-size:13px;padding:0}
.padx{flex:0 0 auto;width:48px;height:48px;border-radius:50%;background:#fff;color:#3b2a55;font-size:18px;font-weight:700;padding:0;box-shadow:0 3px 0 #c9b9ea}
.padc .padtip{grid-area:t;direction:rtl;font-size:clamp(12px,2.2vmin,16px);line-height:1.3;text-align:center;color:#5b4a78;font-weight:700}
.padm{grid-area:m;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--g);min-width:0}
.padcap{font-size:clamp(14px,3.8vmin,20px);line-height:1.25;max-height:calc(3.75em + 6px);overflow:hidden;text-align:center;background:#fff;border-radius:12px;padding:3px 12px;box-shadow:0 2px 0 #e4dcf5}
.padc .padg{display:grid;gap:2px;justify-content:center;justify-items:center;align-items:center;direction:ltr}
.padc .pd{min-width:0;width:100%;height:var(--u);line-height:var(--u);font-size:calc(var(--u)*.72);text-align:center;white-space:nowrap}
.padc .pd.ps{font-size:calc(var(--u)*.62);color:#7a4fe0}
.padc .pd.x,.padc .pc.x{text-decoration:line-through;text-decoration-color:#ff4f9a;text-decoration-thickness:3px}
.padc .pd.x{color:#a79bbd}
.padc .pd.plab{direction:rtl;font-size:max(11px,calc(var(--u)*.3));color:#7a4fe0;line-height:1;height:auto;align-self:end;justify-self:center;width:auto}
.padc .pc{width:var(--u);height:var(--u);border-radius:calc(var(--u)*.22);background:#fff;border:2px dashed #c9b9ea;font-size:calc(var(--u)*.66);line-height:1;color:#3b2a55;padding:0}
.padc .pc.car{width:var(--s);height:var(--s);border-radius:8px;border-width:1.5px;font-size:calc(var(--s)*.62);color:#e0357f;border-color:#ff8fc0;background:#fff0f7}
.padc .pc.car.two{width:calc(var(--s)*1.3)}
.padc .pc.zc{color:#8a7fa3;border-color:#d9d3e6;background:rgba(255,255,255,.55)}
.padc .pc.rem{border-color:#ffb300;background:#fffbe6}
.padc .pc.on{border-style:solid;border-color:#ff4f9a;box-shadow:0 0 0 3px rgba(255,79,154,.28)}
.padc .pl{height:3px;background:#3b2a55;border-radius:2px;width:100%}
.padc .pbr{width:3px;height:calc(var(--u) + 5px);margin-top:-5px;background:#3b2a55;border-radius:0 2px 2px 2px;justify-self:end;align-self:start}
.padc .pfx{display:flex;gap:2px;align-items:center;justify-content:center;direction:ltr}
.padc .pfx .pd{width:auto;min-width:calc(var(--u)*.7);padding:0 calc(var(--u)*.06)}
.padc .padf{gap:0;background:#fff;border:2px solid #9fc0e6;border-radius:10px;overflow:hidden}
.padc .pc.fc{border:0;border-radius:0;background:transparent;box-shadow:inset -1px -1px 0 #c5daf0;font-size:calc(var(--u)*.6)}
.padc .pc.fc.on{background:#fff0f6;box-shadow:inset 0 0 0 3px #ff4f9a}
.padc .padk{grid-area:k;display:grid;grid-template-columns:repeat(var(--kc),var(--k));gap:6px;padding-bottom:4px;direction:ltr}
.padc .pk{width:var(--k);height:var(--k);border-radius:14px;background:#fff;color:#3b2a55;font-size:calc(var(--k)*.46);font-weight:700;padding:0;box-shadow:inset 0 -3px 0 #ece6f8,0 4px 0 #b9a6e6}
.padc .pk:active{transform:translateY(2px)}
.padc .pk.sg{background:#e9f4ff;color:#1f5fa8;box-shadow:inset 0 -3px 0 #d3e8fb,0 4px 0 #8fb8e6}
.padc .pk.del{background:#ffe3ee;box-shadow:inset 0 -3px 0 #ffd0e2,0 4px 0 #f08fb6}
.padc .pk.clr{background:#fff1b8;box-shadow:inset 0 -3px 0 #ffe58a,0 4px 0 #e0b63a}
.padback{grid-area:b;min-height:52px;padding:0 26px;border-radius:999px;background:#38b872;color:#fff;font-size:clamp(16px,3vmin,22px);font-weight:700;direction:rtl;box-shadow:0 4px 0 #23894f}
.padbtn b{white-space:nowrap}
/* PAD-END */
/* SCROLLMAP-BEGIN ===== task "maps that scroll": the map of a topic, the world map and the challenge map. The island with the trail lies in a scroll
   area of its own (.mscroll inside .mwrap). A map whose stops fit at their comfortable size looks as before and nothing scrolls. Otherwise (.scrl) the island
   is taller than its window and moves up and down in it by plain native scrolling; the arrows, the parents' button and everything outside .mwrap stay.
   .up / .dn: there is more map above / below (set by an IntersectionObserver, never by a scroll handler). .side: a wide map, the arrows keep a lane at its side. */
.mwrap{position:relative;flex:1 1 0;min-height:0;width:100%;max-width:1240px}
.mscroll{position:absolute;inset:0;display:block}
.mwrap.lay>.mscroll{overflow:hidden}
.mscroll>.tmap{display:block;flex:none;width:100%;max-width:none;height:100%}
.mwrap.scrl>.mscroll{inset:-12px -8px 0;padding:12px 8px 14px;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:none}
.mwrap.scrl>.mscroll::-webkit-scrollbar{display:none}
.mend{position:absolute;left:0;top:0;width:1px;height:2px;pointer-events:none;visibility:hidden}
.mend.z{top:auto;bottom:0}
.mwrap.scrl .mend.a{top:-12px}.mwrap.scrl .mend.z{bottom:-14px}
body .mwrap .mlab{font-size:clamp(16px,calc(12.5px*var(--s)),20px)}
.mwrap>.parb{position:absolute;bottom:0;inset-inline-start:0;margin:0;z-index:3}
.marr{display:none;position:absolute;z-index:4;left:50%;margin-left:-24px;width:48px;height:48px;border-radius:50%;padding:0;align-items:center;justify-content:center;font-size:20px;line-height:1;background:#fffaf0;color:#3b2a15;border:2px solid #b9783a;box-shadow:0 3px 0 #8a5524;transition:transform .12s}
.marr:active{transform:translateY(3px)}
.mup{top:4px}.mdn{bottom:4px}
.mwrap.scrl.up>.mup,.mwrap.scrl.dn>.mdn{display:flex}
.mwrap.side>.marr{left:0;margin-left:0}.mwrap.side>.mup{top:0}
.mwrap.scrl.up>.mscroll{-webkit-mask-image:linear-gradient(to bottom,transparent 8px,#000 44px);mask-image:linear-gradient(to bottom,transparent 8px,#000 44px)}
.mwrap.scrl.dn>.mscroll{-webkit-mask-image:linear-gradient(to top,transparent 0,#000 36px);mask-image:linear-gradient(to top,transparent 0,#000 36px)}
.mwrap.scrl.up.dn>.mscroll{-webkit-mask-image:linear-gradient(to bottom,transparent 8px,#000 44px,#000 calc(100% - 36px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 8px,#000 44px,#000 calc(100% - 36px),transparent 100%)}
.mwrap.side.up>.mscroll{-webkit-mask-image:linear-gradient(to bottom,transparent 8px,#000 28px);mask-image:linear-gradient(to bottom,transparent 8px,#000 28px)}
.mwrap.side.dn>.mscroll{-webkit-mask-image:linear-gradient(to top,transparent 0,#000 16px);mask-image:linear-gradient(to top,transparent 0,#000 16px)}
.mwrap.side.up.dn>.mscroll{-webkit-mask-image:linear-gradient(to bottom,transparent 8px,#000 28px,#000 calc(100% - 16px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 8px,#000 28px,#000 calc(100% - 16px),transparent 100%)}
body.toy .marr{background:#fff;color:var(--ti);border-color:#fff;box-shadow:0 4px 0 var(--te2),0 7px 10px rgba(0,0,0,.2)}
body.toy .mwrap>.parb{background:#fff;color:var(--ti);box-shadow:0 4px 0 var(--te2)}
/* SCROLLMAP-END */
/* DS-BEGIN ================= the design system (task "ds"; the approved direction A of spike/polish; for agents: docs/prompts/ds-handoff.md) =================
   ONE set of tokens and base components for the whole game. A screen is converted by using these tokens and classes instead of numbers of its own.
   TOKENS (custom properties on body.toy)
   type     --t-cap 14 · --t-body 16 · --t-lead 20 (17 on a 360 px phone) · --t-h2 24 (20) · --t-h1 32 (26) · --t-num 48 (36): the four big sizes are clamp()s on vmin
            line heights are multiples of 4: --lh-cap 20 · --lh-body 24 · --lh-lead 24 · --lh-h2 32 · --lh-h1 40 · --lh-num 56
            --w-reg 500 · --w-bold 700 · --w-black 800
   space    --sp1 4 · --sp2 8 · --sp3 12 · --sp4 16 · --sp5 24 · --sp6 32 · --sp7 48   (the 4/8 grid; --s0/--s1 were taken by the sky)
   radius   --r-s 12 (chip, label) · --r-m 16 (button, toast) · --r-l 24 (card, panel) · --r-full 999 (round button, capsule, counters)
   colour   --ink text and icons · --ink-2 secondary text · --surface cards, chips, buttons · --surface-2 sunken area inside a card · --line hairline, empty pip
            --edge the solid edge under a surface · --primary THE action of the screen (+ --primary-edge) · --success right, done, next (+ --success-edge)
            --accent "you are here", warning, gift (+ --accent-edge) · --locked locked icon · --locked-ink locked text · --locked-surface
            --ans-0 pink · --ans-1 blue · --ans-2 orange-brown · --ans-3 purple (+ --ans-0e ... --ans-3e their edges): the four answers, white text 4.6:1 or better
            --c-star · --energy · --heart: the colours of the three small glyphs
            the world keeps the names of the skin: --s0 --s1 sky · --w0 --w1 sea · --g0..--g3 island grass · --sand --sand2 (they change at dusk and at night)
   shadow   ONE recipe: a solid edge below + one soft ambient shadow. --e1 (chip, button, toast) · --e2 (card) · --e3 (panel, overlay card);
            a coloured button uses its own edge colour: 0 4px 0 <edge>, 0 10px 20px <soft>. Pressed: --press (translateY(3px)) and the edge drops to 1px
   motion   --d-fast 120ms · --d-base 200ms · --d-slow 360ms · --ease · --spring. Only transform and opacity move.
   The variables of the older blocks (--ti --tp --tc --te --te2 --tmain --tnext --tgold --tpink ...) now point at these tokens, so unconverted screens shift with them. */
body.toy{
  --t-cap:14px;--t-body:16px;--t-lead:clamp(17px,5vmin,20px);--t-h2:clamp(20px,6vmin,24px);--t-h1:clamp(26px,8vmin,32px);--t-num:clamp(36px,11vmin,48px);
  --lh-cap:20px;--lh-body:24px;--lh-lead:24px;--lh-h2:32px;--lh-h1:40px;--lh-num:56px;
  --w-reg:500;--w-bold:700;--w-black:800;
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:32px;--sp7:48px;
  --r-s:12px;--r-m:16px;--r-l:24px;--r-full:999px;
  --ink:#2e2350;--ink-2:#5a5177;--surface:#fff;--surface-2:#f3f0fa;--line:#e2dcf1;--edge:#c9bfe6;
  --primary:#c2185b;--primary-edge:#8a0f40;--success:#1b7f3b;--success-edge:#115426;
  --accent:#ffc83d;--accent-edge:#d99a00;--locked:#8c86a3;--locked-ink:#5d5670;--locked-surface:#e9e6f1;
  --ans-0:#d6266f;--ans-0e:#8f1148;--ans-1:#1976c8;--ans-1e:#0f4f8f;--ans-2:#b25e00;--ans-2e:#7a3f00;--ans-3:#7a4ae0;--ans-3e:#4f2ba6;
  --c-star:#e79b00;--energy:#f26a1b;--heart:#e0356f;
  --e1:0 2px 0 var(--edge),0 4px 10px rgba(46,35,80,.12);--e2:0 4px 0 var(--edge),0 10px 20px rgba(46,35,80,.16);--e3:0 6px 0 var(--edge),0 18px 36px rgba(46,35,80,.22);
  --press:translateY(3px);
  --d-fast:120ms;--d-base:200ms;--d-slow:360ms;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  /* the older names follow the tokens */
  --ti:var(--ink);--tp:var(--surface);--tc:var(--surface-2);--te:var(--line);--te2:var(--edge);--tsh:rgba(46,35,80,.16);--tgold:var(--accent);--tpink:var(--primary);--tpip:var(--line);--tpipon:#f2a900;
  --tmain:var(--primary);--tmaine:var(--primary-edge);--tnext:var(--success);--tnexte:var(--success-edge);
  color:var(--ink)}
/* ---- icons (every skin): icon(name, size) in the ui block. Coloured by currentColor; three glyphs carry a colour of their own ---- */
svg.ic{width:24px;height:24px;max-width:none;max-height:none;flex:none;display:inline-block;vertical-align:middle;fill:currentColor;pointer-events:none;position:static;transform:none;animation:none;filter:none}
svg.ic.ic-s{width:16px;height:16px}svg.ic.ic-m{width:20px;height:20px}svg.ic.ic-xl{width:32px;height:32px}
svg.ic.ic-t{width:1.15em;height:1.15em;vertical-align:-.2em}
svg.ic.ic-flip{transform:scaleX(-1)}
.ic-star{color:#e79b00}.ic-energy{color:#f26a1b}.ic-heart{color:#e0356f}
.ic-coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe28a,#f5b400 70%);box-shadow:inset 0 0 0 2px #d99a00}.ic-coin path{display:none}
.btn .ic-star,.btn .ic-energy,.btn .ic-heart{color:inherit}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.ct{display:inline-flex;align-items:center;gap:4px}.ct .num{font-weight:inherit}
.chip.who{display:inline-flex;align-items:center;gap:4px}.chip.who .whon{overflow:hidden;text-overflow:ellipsis;min-width:0}
.tgroup{display:flex;gap:8px;align-items:center}
/* ---- the top bar: ONE row on every size. Start: [back home] [music sound] (on the camp: [player] [music sound]); end: the counters, one flat pill ---- */
body.toy .top{flex-wrap:nowrap;gap:var(--sp2);min-height:48px;position:relative}
body.toy .top .chips.nav{gap:var(--sp2);flex:0 0 auto}
body.toy .tgroup{gap:0;height:48px;background:var(--surface);border-radius:var(--r-full);box-shadow:var(--e1)}
body.toy .top .icon{width:48px;height:48px;display:grid;place-items:center;padding:0;background:none;box-shadow:none;color:var(--ink);border-radius:var(--r-full);font-size:var(--t-body);transition:transform var(--d-fast) var(--ease),background var(--d-fast) var(--ease)}
body.toy .top .icon:active{background:var(--surface-2);transform:scale(.94)}
body.toy .top .icon.off,body.toy .top .icon.dim{color:var(--locked);opacity:1}
body.toy .top .chips.cnt{margin-inline-start:auto;flex:0 0 auto;gap:var(--sp2);height:32px;padding:0 10px;background:rgba(255,255,255,.88);border-radius:var(--r-full)}
body.toy .top .ct{background:none;box-shadow:none;padding:0;border-radius:0;gap:var(--sp1);font-size:var(--t-body);font-weight:var(--w-bold);line-height:1;color:var(--ink)}
body.toy .top .ct .ic{width:18px;height:18px}
body.toy .top .chip.who{flex:0 1 auto;min-width:48px;max-width:11em;height:48px;padding:0 var(--sp3) 0 var(--sp4);background:var(--surface);color:var(--ink);border-radius:var(--r-full);box-shadow:var(--e1);font-size:var(--t-body);font-weight:var(--w-bold);transition:transform var(--d-fast) var(--ease)}
body.toy .top .chip.who:active{transform:var(--press);box-shadow:0 1px 0 var(--edge)}
/* phones: the pill is compact; with long numbers (.long = 9 digits or more in the three counters, .xlong = 12, .xxlong = 13 or more; set by ctSet) it gets tighter */
@media (max-width:520px){
  body.toy .top .cnt.long .ct{font-size:var(--t-cap);gap:3px}body.toy .top .cnt.long .ct .ic{width:16px;height:16px}body.toy .top .cnt.long{gap:6px;padding:0 var(--sp2)}
  body.toy .top .cnt.xxlong .ct{font-size:12px}
}
@media (max-width:420px){
  body.toy .top,body.toy .top .chips.nav{gap:var(--sp1)}
  body.toy .top .chips.cnt{gap:6px;padding:0 6px}body.toy .top .ct{font-size:var(--t-cap);gap:3px}body.toy .top .ct .ic{width:16px;height:16px}
  body.toy .top .cnt.long{gap:5px;padding:0 6px}body.toy .top .cnt.long .ct{font-size:12px;gap:2px}body.toy .top .cnt.long .ct .ic{width:14px;height:14px}
  body.toy .top .cnt.xxlong .xpchip{display:none}
  body.toy .top .chip.who{padding:0 var(--sp2) 0 var(--sp3)}
}
@media (max-width:380px){body.toy .top .icon{width:44px}body.toy .top.tight .icon{width:42px}}
/* ---- title: plain ink on the world, no pill. By night the sky is dark, so a title that stands on the world is white ---- */
:where(body.toy) .h2,:where(body.toy) .title{background:none;box-shadow:none;border-radius:0;padding:0;color:var(--ink);font-weight:var(--w-black);-webkit-text-stroke:0;text-shadow:none}
body.toy .rmap .h2,body.toy .camp .title,body.toy .tpl>.h2,body.toy #podium .h2{background:none;box-shadow:none;border-radius:0;color:var(--ink);font-weight:var(--w-black)}
body.toy.night .screen>.h2,body.toy.night .screen>.title,body.toy.night .camp .title{color:#fff;text-shadow:0 2px 0 rgba(12,34,96,.6)}
.ds-title{margin:0;font-size:var(--t-h2);line-height:var(--lh-h2);font-weight:var(--w-black);color:var(--ink);text-align:center}
/* ---- buttons. .btn = primary (THE action); .btn.b2 = secondary (white); .btn.b3 = accent; .btn.check / .btn.nxt = success; .btn.quiet = tertiary; .icon = round icon button.
   The shape is one: radius --r-m, a 4 px solid edge and a soft shadow, pressed = 3 px down. Screens keep their own sizes until they are converted. ---- */
:where(body.toy) .btn{border-radius:var(--r-m);background:var(--primary);color:#fff;font-weight:var(--w-bold);text-shadow:none;box-shadow:0 4px 0 var(--primary-edge),0 10px 20px rgba(138,15,64,.28);transition:transform var(--d-fast) var(--ease),box-shadow var(--d-fast) var(--ease)}
:where(body.toy) .btn.b2{background:var(--surface);color:var(--ink);box-shadow:var(--e1)}
:where(body.toy) .btn.b3{background:var(--accent);color:var(--ink);box-shadow:0 4px 0 var(--accent-edge),0 10px 20px rgba(46,35,80,.16)}
:where(body.toy) .btn.check,:where(body.toy) .btn.nxt{background:var(--success);color:#fff;box-shadow:0 4px 0 var(--success-edge),0 10px 20px rgba(17,84,38,.25)}

/* XR-BEGIN ================= task "exercise screen": the approved arrangement of the exercise (direction A, spike/polish/a-system/round.html), the
   explanation window and the calculation sheet in the design system. Everything here starts with body.toy; the screen of an exercise carries .xr.
   From the top: the bar · the stones of the round (.path; inside the row of the bar from 800 px wide) · the companion with what it says (.crow)
   · ONE card (.qcard: .qcap = the stage and the house as quiet text + the read-aloud button, then the question) · the answers · the helpers (.tools).
   .snug (set by roomFit when the exercise is taller than its room): the companion stands beside the stones and what it says is not shown.
   A screen at most 520 px high (a phone on its side) cannot hold that column: the companion stands beside the card without its bubble, the
   helpers stand in a column at the other side of the card, the stage label is not shown, the read-aloud button is in the corner of the card.
   Nothing moves here while the child thinks: the stones, the "?" box and the answers stand still. */
body.toy .screen.xr{--k:1;--xw:720px;--xg:var(--sp2);--xp:var(--sp2);--xb:52px;gap:var(--xg);padding:var(--xp)}
/* ---- the stones of the round ---- */
body.toy .screen.xr>.path{gap:var(--sp2);min-height:32px;flex:0 0 auto;direction:rtl}
body.toy .screen.xr .node{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.78);color:var(--ink);font-size:var(--t-cap);font-weight:var(--w-bold);font-style:normal;line-height:1;box-shadow:none;animation:none;transform:none;transition:none}
body.toy .screen.xr .node.now{width:32px;height:32px;margin:-4px 0;background:var(--accent);color:var(--ink);box-shadow:0 2px 0 var(--accent-edge)}
body.toy .screen.xr .node.done{background:var(--success);color:#fff}
body.toy .screen.xr .node.done .ic{width:14px;height:14px;color:#fff}
body.toy .screen.xr .node.done.log{background:rgba(255,255,255,.78)}
body.toy .screen.xr .node .ico{width:16px;height:16px;vertical-align:0}
/* ---- the companion and what it says, above the card ---- */
body.toy .screen.xr .crow{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:var(--sp3);width:100%;max-width:var(--xw);min-height:0;flex:0 0 auto}
body.toy .screen.xr .buddy{display:block;position:static;inset:auto;z-index:auto;width:var(--xb);flex:none}
body.toy .screen.xr .bubble{display:block;position:relative;flex:0 1 auto;min-width:0;padding:var(--sp2) var(--sp4);background:var(--surface);color:var(--ink);border-radius:var(--r-m);box-shadow:var(--e1);font-size:var(--t-body);line-height:var(--lh-body);font-weight:var(--w-bold);text-wrap:balance}

body.toy .screen.xr .bubble.good{background:var(--success);color:#fff;box-shadow:0 2px 0 var(--success-edge),0 4px 10px rgba(46,35,80,.12)}
body.toy .screen.xr .bubble:empty{visibility:hidden}

<script id="logic">
var TrollLogic = (function () {
  'use strict';

  function ri(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function seeded(seed) {
    var s = (seed >>> 0) || 1;
    return function () {
      s = (s + 0x6D2B79F5) >>> 0;
      var t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  // Keeps a math expression left-to-right inside Hebrew (right-to-left) text.
  function ltr(s) { return '⁦' + s + '⁩'; }
  function distinct(n, gen) {
    var seen = {}, out = [], g = 0;
    while (out.length < n && g++ < 2000) { var x = gen(); if (!seen[x]) { seen[x] = true; out.push(x); } }
    return out;
  }

  // ---------- answer options: always 4 distinct non-negative integers, one correct ----------
  function options(answer, rng, extra) {
    var steps = answer >= 1000 ? [100, 1000, 10, 200] : answer >= 100 ? [10, 100, 1, 20] : answer >= 20 ? [1, 10, 2, 5] : [1, 2, 3];
    var near = [];
    steps.forEach(function (s) { near.push(answer + s, answer - s); });
    var cand = shuffle(extra || [], rng).slice(0, 2).concat(shuffle(near, rng));
    var set = {}, opts = [answer]; set[answer] = true;
    for (var i = 0; i < cand.length && opts.length < 4; i++) {
      var c = cand[i];
      if (c === Math.floor(c) && c >= 0 && !set[c]) { set[c] = true; opts.push(c); }
    }
    var span = answer >= 1000 ? 500 : answer >= 100 ? 50 : 10, g = 0;
    while (opts.length < 4 && g++ < 2000) {
      var r = answer + ri(rng, -span, span);
      if (r >= 0 && !set[r]) { set[r] = true; opts.push(r); }
    }
    return shuffle(opts, rng);
  }
  // o: {rtl, extra, options, tip, vis}
  function Q(rng, text, answer, o) {
    o = o || {};
    var q = {
      text: text, answer: answer, rtl: !!o.rtl,
      options: o.options ? shuffle(o.options, rng) : options(answer, rng, o.extra),
      hint: { tip: o.tip || '', vis: o.vis || null }
    };
    if (o.ex) q.exPre = o.ex;   // an explanation written for this exercise
    if (o.fmt) q.fmtPre = o.fmt; // an exercise that is born in another activity format
    return q;
  }
  function expr(rng, e, answer, o) { return Q(rng, e + ' = ?', answer, o); }

  // ---------- shared generators ----------
  function table(r, facs) {
    var a = pick(r, facs), b = ri(r, 2, 10), t;
    if (r() < 0.5) { t = a; a = b; b = t; }
    return expr(r, a + ' × ' + b, a * b, {
      extra: [a * (b + 1), a * (b - 1), (a + 1) * b, (a - 1) * b],
      tip: a + ' קְבוּצוֹת שֶׁל ' + b + '. אֶפְשָׁר לְחַשֵּׁב בְּחִבּוּר חוֹזֵר', vis: { t: 'groups', a: a, b: b }
    });
  }
  function tableDiv(r, divs) {
    var b = pick(r, divs), q = ri(r, 2, 10), c = b * q;
    return expr(r, c + ' : ' + b, q, {
      extra: [q + 1, q - 1, b],
      tip: 'כַּמָּה קְבוּצוֹת שֶׁל ' + b + ' יֵשׁ בְּ-' + c + '? אֶפְשָׁר לְהֵעָזֵר בְּלוּחַ הַכֶּפֶל שֶׁל ' + b,
      vis: c <= 60 ? { t: 'div', a: c, b: b } : null
    });
  }
  function missAdd(r, a, b, visOk) {
    var c = a + b, f = ri(r, 0, 3), tip = 'הַפְּעֻלָּה הַהֲפוּכָה עוֹזֶרֶת: חִסּוּר בּוֹדֵק חִבּוּר, וְחִבּוּר בּוֹדֵק חִסּוּר';
    if (f === 0) return Q(r, '□ + ' + fmt(b) + ' = ' + fmt(c), a, { tip: tip, vis: visOk ? { t: 'missing', a: b, b: c } : null });
    if (f === 1) return Q(r, fmt(a) + ' + □ = ' + fmt(c), b, { tip: tip, vis: visOk ? { t: 'missing', a: a, b: c } : null });
    if (f === 2) return Q(r, fmt(c) + ' − □ = ' + fmt(a), b, { tip: tip });
    return Q(r, '□ − ' + fmt(b) + ' = ' + fmt(a), c, { tip: tip });
  }
  function seq(r, steps, maxStartMul) {
    var step = pick(r, steps), down = r() < 0.3, start = step * ri(r, 1, maxStartMul) + (r() < 0.4 && step < 20 ? ri(r, 1, step - 1) : 0);
    var terms = [], i, hide = ri(r, 2, 4);
    for (i = 0; i < 5; i++) terms.push(start + i * step);
