<p>גדול: גרסת "צעצוע". קטן (עד 72 פיקסלים גובה): גרסה עם קו מתאר. צמתים לטרול בממוצע: גדול <span id="nb"></span>, קטן <span id="ns"></span>.</p>
<div class="nav"><a href="#sec=moods">הבעות</a><a href="#sec=motion">תנועות</a><a href="#sec=frames">תנועות בתמונות עומדות</a><a href="#sec=items">כל הפריטים</a><a href="#">הכול</a></div>
<div id="out"></div>
<script>
// Troll drawing: pure string generation, no DOM access. One light from the upper left; every mood is a row of parameters.
//   TrollArt.trollSVG(spec, opts)
//   spec: {id, body, hairColor, hair (0-5), acc, eyes (0-2)} + optional emoji items hatE, faceE, handE, petE
//   opts.mood: happy | think | cheer | sad | curious | surprised | proud | focused | sleepy | wave (or waving) | oops
//   opts.size: the height it is shown at, in px. Up to 72: the small troll (outlined, fewer parts, class "sm"); above: the large "toy" troll.
//              Without a size the large troll is drawn and marked data-u, and the page draws it again small if it turns out small (trollFit in the ui block).
//   opts.look: {x, y} from -1 to 1 (where the eyes look; such a troll has the class "lk" and its pupils are not moved by CSS)
//   opts.tear: false removes the tear of 'sad'      opts.v: 2 toy | 3 outlined (overrides the choice by size)      opts.uid: a fixed id for the gradients
// Groups for motion (CSS): .tb the whole troll, .hair, .fc the face, .eyes, .pup, .arm.armL/.armR, .ft.ftL/.ftR, .sh the shadow, .hE the item in the hand, .pet, .zz
var TrollArt = (function () {
  'use strict';
  var seq = 0, KEEP = 400, mem = {}, INK = '#3b2a55', MOUTH = '#6b2140', TONGUE = '#ff7aa8';

  // ---------- colour ----------
  function hx(hex) { var h = String(hex).replace('#', ''); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; var n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
  function shade(hex, f) { // the game's helper: f < 0 towards black, f > 0 towards white
    var c = hx(hex);
    return 'rgb(' + c.map(function (x) { return Math.max(0, Math.min(255, Math.round(f < 0 ? x * (1 + f) : x + (255 - x) * f))); }).join(',') + ')';
  }
  // tone: like shade, but a shadow also turns away from yellow and gains saturation, a light turns towards yellow
  // (the way the Fluent objects are painted), so that a shaded pastel stays a colour and does not turn grey
  function tone(hex, k) {
    if (!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(hex)) return hex;
    var c = hx(hex), r = c[0] / 255, g = c[1] / 255, b = c[2] / 255, mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, s = 0, h = 0, d = mx - mn;
    if (d) { s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
    var y = ((h - 60 + 540) % 360) - 180, a;
    if (k < 0) { a = Math.min(-k * 30, 180 - Math.abs(y)); y += y > 0 ? a : -a; l *= 1 + k; s *= 1 + k * .6; }
    else { a = Math.min(k * 30, Math.abs(y)); y -= y > 0 ? a : -a; l += (1 - l) * k; }
    h = (y + 60 + 360) % 360;
    var q = l < .5 ? l * (1 + s) : l + s - l * s, p = 2 * l - q;
    function ch(t) { t = (t + 360) % 360; var v = t < 60 ? p + (q - p) * t / 60 : t < 180 ? q : t < 240 ? p + (q - p) * (240 - t) / 60 : p; return ('0' + Math.round(v * 255).toString(16)).slice(-2); }
    return '#' + ch(h + 120) + ch(h) + ch(h - 120);
  }
  // soft: a quieter shadow colour for limbs and nose (half way between tone and the game's plain shade)
  function soft(hex, k) { var a = hx(tone(hex, k)), b = hx(hex); return '#' + a.map(function (x, i) { return ('0' + Math.round((x + b[i] * (1 + k)) / 2).toString(16)).slice(-2); }).join(''); }
  function n1(x) { return Math.round(x * 10) / 10; }
  function circ(cx, cy, r) { return 'M' + n1(cx - r) + ',' + n1(cy) + 'a' + r + ',' + r + ' 0 1,0 ' + 2 * r + ',0a' + r + ',' + r + ' 0 1,0 ' + (-2 * r) + ',0'; }
  // the part of a circle above (top) or below (bottom) a chord; t = covered share of the height (0 to 1)
  function seg(cx, cy, r, t, bottom) {
    var yy = bottom ? cy + r - 2 * r * t : cy - r + 2 * r * t, w = Math.sqrt(Math.max(0, r * r - (yy - cy) * (yy - cy)));
    return 'M' + n1(cx - w) + ',' + n1(yy) + 'A' + r + ',' + r + ' 0 ' + (t > .5 ? 1 : 0) + ',' + (bottom ? 0 : 1) + ' ' + n1(cx + w) + ',' + n1(yy) + 'Q' + cx + ',' + n1(yy + (bottom ? -1 : 1) * 3 * (1 - t)) + ' ' + n1(cx - w) + ',' + n1(yy) + 'Z';
  }
  function grad(kind, id, geo, stops) {
    return '<' + kind + 'Gradient id="' + id + '" ' + geo + '>' + stops.map(function (s) {
      return '<stop offset="' + s[0] + '" stop-color="' + s[1] + '"' + (s[2] != null ? ' stop-opacity="' + s[2] + '"' : '') + '/>';
    }).join('') + '</' + kind + 'Gradient>';
  }

  // ---------- hair: the six silhouettes of the game, untouched. f = fill, l = light, d = dark, lv = level, big = not the simplified troll ----------
  var HAIRD = [
    'M56,120 Q36,44 100,4 Q164,44 144,120 Z',
    'M58,118 L40,40 L80,70 L100,8 L120,70 L160,40 L142,118 Z',
    circ(64, 82, 32) + circ(136, 82, 32) + circ(100, 52, 40) + circ(100, 96, 36),
    'M56,120 C30,66 62,36 100,36 C130,36 150,14 122,4 C172,0 176,66 144,120 Z',
    'M74,116 Q10,86 18,18 Q66,44 100,104 Z M126,116 Q190,86 182,18 Q134,44 100,104 Z ' + circ(100, 100, 28),
    'M60,120 Q44,32 114,6 Q98,40 142,22 Q128,54 160,60 Q140,86 142,120 Z'
  ];
  function hairSmall(hs, f) { return '<path d="' + HAIRD[hs] + '" fill="' + f + '"' + (hs === 1 ? ' stroke="' + f + '" stroke-width="12" stroke-linejoin="round"' : '') + '/>'; }
  var HAIR = [
    function (f, l, d, lv, big) {
      return '<path d="' + HAIRD[0] + '" fill="' + f + '"/><path d="M78,116 Q70,62 100,26 Q130,62 122,116 Z" fill="' + l + '" opacity=".4"/>' +
        (big && lv > 1 ? '<path d="M71,112 Q60,60 97,15 M129,112 Q140,60 103,15" fill="none" stroke="' + d + '" stroke-width="3" stroke-linecap="round" opacity=".4"/>' : '') +
        (big ? '<path d="M63,86 Q60,52 85,27" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".38"/>' : '');
    },
    function (f, l, d, lv, big) {
      return '<path d="' + HAIRD[1] + '" fill="' + f + '" stroke="' + f + '" stroke-width="12" stroke-linejoin="round"/><path d="M88,112 L100,34 L112,112 Z" fill="' + l + '" opacity=".42"/>' +
        (big && lv > 1 ? '<path d="M70,110 L55,62 M130,110 L145,62" fill="none" stroke="' + d + '" stroke-width="3" stroke-linecap="round" opacity=".4"/>' : '') +
        (big ? '<path d="M46,52 L56,96 M95,30 L88,62" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".38"/>' : '');
    },
    function (f, l, d, lv, big) {
      return '<g fill="' + f + '"><circle cx="64" cy="82" r="32"/><circle cx="136" cy="82" r="32"/><circle cx="100" cy="52" r="40"/><circle cx="100" cy="96" r="36"/></g>' +
        (big ? '<path d="M70,38 Q78,22 96,20 M42,74 Q44,62 54,58" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".42"/>' : '') +
        (big && lv > 1 ? '<path d="M112,30 q12,4 14,16 M150,70 q8,8 4,20 M50,96 q-6,-10 2,-20" fill="none" stroke="' + d + '" stroke-width="3" stroke-linecap="round" opacity=".35"/>' : '');
    },
    function (f, l, d, lv, big) {
      return '<path d="' + HAIRD[3] + '" fill="' + f + '"/><path d="M80,112 C66,74 84,56 104,54 C124,52 138,40 132,26" fill="none" stroke="' + l + '" stroke-width="8" stroke-linecap="round" opacity=".5"/>' +
        (big && lv > 1 ? '<path d="M64,108 C48,74 66,48 100,45 M134,110 C150,86 158,58 150,32" fill="none" stroke="' + d + '" stroke-width="3" stroke-linecap="round" opacity=".4"/>' : '');
    },
    function (f, l, d, lv, big) {
      return '<path d="' + HAIRD[4] + '" fill="' + f + '"/><circle cx="52" cy="84" r="8" fill="' + l + '"/><circle cx="148" cy="84" r="8" fill="' + l + '"/>' +
        (big && lv > 1 ? '<path d="M34,40 Q56,60 74,92 M166,40 Q144,60 126,92" fill="none" stroke="' + d + '" stroke-width="3" stroke-linecap="round" opacity=".4"/>' : '') +
        (big ? '<path d="M25,32 Q27,56 40,74" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".38"/>' : '');
    },
    function (f, l, d, lv, big) {
      return '<path d="' + HAIRD[5] + '" fill="' + f + '"/><path d="M82,112 Q76,58 104,34" fill="none" stroke="' + l + '" stroke-width="8" stroke-linecap="round" opacity=".5"/>' +
        (big && lv > 1 ? '<path d="M104,112 Q104,70 128,42 M126,112 Q128,88 146,70" fill="none" stroke="' + d + '" stroke-width="3" stroke-linecap="round" opacity=".4"/>' : '');
    }
  ];

  // ---------- accessories: the game's drawings, unchanged ----------
  var ACC = {
    none: '',
    sunglasses: '<path d="M54,150 h40 v10 a20,17 0 0 1 -40,0 Z M106,150 h40 v10 a20,17 0 0 1 -40,0 Z" fill="#3b2a55"/><path d="M92,154 h16" stroke="#3b2a55" stroke-width="5"/><path d="M60,156 h9 M112,156 h9" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>',
    bowtie: '<g transform="translate(100,228)"><path d="M0,0 L-19,-11 L-19,11 Z M0,0 L19,-11 L19,11 Z" fill="#3aa0ff" stroke="#3aa0ff" stroke-width="4" stroke-linejoin="round"/><circle r="6" fill="#1f6fc9"/></g>',
    scarf: '<path d="M40,212 Q100,240 160,212 L158,228 Q100,256 42,228 Z" fill="#ff6a3d"/><path d="M126,236 l5,28 l17,-4 l-7,-28 Z" fill="#ff6a3d"/><path d="M60,226 l3,12 M84,233 l2,12 M110,234 l0,12 M133,246 l14,-3" stroke="#ffd23f" stroke-width="4"/>',
    headphones: '<path d="M36,158 Q34,90 100,90 Q166,90 164,158" fill="none" stroke="#3b2a55" stroke-width="8" stroke-linecap="round"/><rect x="22" y="144" width="22" height="40" rx="10" fill="#ff4f9a"/><rect x="156" y="144" width="22" height="40" rx="10" fill="#ff4f9a"/>',
    star: '<path transform="translate(140,108) scale(1.7)" d="M0,-10 L3,-3 L10,-3 L4,2 L6,9 L0,5 L-6,9 L-4,2 L-10,-3 L-3,-3 Z" fill="#ffd23f" stroke="#e8a800" stroke-width="1.5" stroke-linejoin="round"/>',
    butterfly: '<g transform="translate(60,100) rotate(-15)"><ellipse cx="-10" cy="-6" rx="11" ry="9" fill="#a57bff"/><ellipse cx="10" cy="-6" rx="11" ry="9" fill="#a57bff"/><ellipse cx="-8" cy="7" rx="8" ry="7" fill="#ff6fae"/><ellipse cx="8" cy="7" rx="8" ry="7" fill="#ff6fae"/><rect x="-2" y="-12" width="4" height="24" rx="2" fill="#3b2a55"/></g>',
    balloon: '<path d="M166,226 Q176,180 180,150" fill="none" stroke="#3b2a55" stroke-width="2"/><ellipse cx="180" cy="122" rx="19" ry="25" fill="#ff4f6a"/><path d="M176,147 l8,0 l-4,-6 Z" fill="#ff4f6a"/><ellipse cx="173" cy="112" rx="5" ry="8" fill="#fff" opacity=".5"/>',
    wand: '<g transform="rotate(-18 34 228)"><rect x="31" y="172" width="6" height="58" rx="3" fill="#8e5cff"/><path transform="translate(34,166) scale(1.6)" d="M0,-10 L3,-3 L10,-3 L4,2 L6,9 L0,5 L-6,9 L-4,2 L-10,-3 L-3,-3 Z" fill="#ffd23f" stroke="#e8a800" stroke-width="1.5" stroke-linejoin="round"/></g>',
    necklace: '<g fill="#ffd23f"><circle cx="70" cy="222" r="5"/><circle cx="80" cy="229" r="5"/><circle cx="92" cy="233" r="5"/><circle cx="108" cy="233" r="5"/><circle cx="120" cy="229" r="5"/><circle cx="130" cy="222" r="5"/></g><path d="M100,232 l-7,8 l7,9 l7,-9 Z" fill="#ff4f9a"/>',
    bow: '<g transform="translate(142,112) rotate(18)"><path d="M0,0 L-20,-14 L-20,14 Z M0,0 L20,-14 L20,14 Z" fill="#ff4f9a" stroke="#ff4f9a" stroke-width="5" stroke-linejoin="round"/><circle r="7" fill="#ffc1dc"/></g>',
    glasses: '<g fill="rgba(255,255,255,.25)" stroke="#3b2a55" stroke-width="4.5"><circle cx="76" cy="160" r="21"/><circle cx="124" cy="160" r="21"/><path d="M97,160 h6" fill="none"/></g>',
    crown: '<path d="M72,112 L66,78 L87,96 L100,70 L113,96 L134,78 L128,112 Z" fill="#ffd23f" stroke="#e8a800" stroke-width="4" stroke-linejoin="round"/><circle cx="100" cy="98" r="5" fill="#ff4f9a"/><circle cx="80" cy="102" r="3.5" fill="#5bb8ff"/><circle cx="120" cy="102" r="3.5" fill="#5bb8ff"/>',
    flower: '<g transform="translate(60,112)"><g fill="#fff"><circle cx="0" cy="-11" r="8"/><circle cx="10" cy="-3" r="8"/><circle cx="6" cy="9" r="8"/><circle cx="-6" cy="9" r="8"/><circle cx="-10" cy="-3" r="8"/></g><circle r="6.5" fill="#ffd23f"/></g>',
    hat: '<g transform="rotate(16 130 104)"><path d="M108,110 L130,56 L152,110 Z" fill="#5bd1ff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><path d="M116,92 L144,92 M122,76 L138,76" stroke="#fff" stroke-width="4"/><circle cx="130" cy="54" r="8" fill="#ffd23f"/></g>'
  };
  var BACK = { wings: '<g fill="#fff" stroke="#9fdcff" stroke-width="3" opacity=".95"><path d="M52,186 Q-14,120 4,196 Q-6,236 54,216 Z"/><path d="M148,186 Q214,120 196,196 Q206,236 146,216 Z"/></g>' };
  // the four accessories that were flat get the same light as the body (large troll and the cards of the cart; the small troll keeps the flat ones)
  var LIT = {
    scarf: function () { return '<path d="M40,212 Q100,240 160,212 L158,228 Q100,256 42,228 Z" fill="#ff6a3d"/><path d="M126,236 l5,28 l17,-4 l-7,-28 Z" fill="#ff6a3d"/>' +
      '<path d="M41,221 Q100,249 159,221 L158,228 Q100,256 42,228 Z M139,233 l2,-1 l7,28 l-5,1.2 Z" fill="#a82c0c" opacity=".38"/><path d="M40,212 Q100,240 160,212 L159.4,216.5 Q100,244.5 40.6,216.5 Z" fill="#fff" opacity=".34"/>' +
      '<path d="M60,226 l3,12 M84,233 l2,12 M110,234 l0,12 M133,246 l14,-3" stroke="#ffd23f" stroke-width="4"/>'; },
    headphones: function () { return '<path d="M36,158 Q34,90 100,90 Q166,90 164,158" fill="none" stroke="#3b2a55" stroke-width="8" stroke-linecap="round"/><path d="M39,140 Q41,96 96,93.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>' +
      '<rect x="22" y="144" width="22" height="40" rx="10" fill="#ff4f9a"/><rect x="156" y="144" width="22" height="40" rx="10" fill="#e0367f"/>' +
      '<path d="M27,152 v14 M161,152 v10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".5"/><path d="M26,178 q7,7 15,0 M160,178 q7,7 15,0" fill="none" stroke="#8f1650" stroke-width="5" stroke-linecap="round" opacity=".4"/>'; },
    crown: function (U) { return '<path d="M72,112 L66,78 L87,96 L100,70 L113,96 L134,78 L128,112 Z" fill="' + U('k') + '" stroke="#e8a800" stroke-width="4" stroke-linejoin="round"/>' +
      '<path d="M73,84 L77,106 M97,82 L92,97" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" opacity=".7"/><path d="M75,109 h50" stroke="#c98a00" stroke-width="3" stroke-linecap="round" opacity=".5"/>' +
      '<circle cx="100" cy="98" r="5" fill="#ff4f9a"/><circle cx="80" cy="102" r="3.5" fill="#5bb8ff"/><circle cx="120" cy="102" r="3.5" fill="#5bb8ff"/><path d="' + circ(98.6, 96.4, 1.4) + circ(79, 100.8, 1) + circ(119, 100.8, 1) + '" fill="#fff" opacity=".9"/>'; },
    wings: function (U) { return '<g stroke="#9fdcff" stroke-width="3" opacity=".95"><path d="M52,186 Q-14,120 4,196 Q-6,236 54,216 Z" fill="' + U('w') + '"/><path d="M148,186 Q214,120 196,196 Q206,236 146,216 Z" fill="' + U('x') + '"/>' +
      '<path d="M46,196 Q20,180 9,172 M46,206 Q22,208 9,214 M154,196 Q180,180 191,172 M154,206 Q178,208 191,214" fill="none" stroke-width="2" stroke-linecap="round"/></g>'; }
  };
  function litDefs(acc, id) {
    return acc === 'crown' ? grad('linear', id + 'k', 'x1="0" y1="0" x2="1" y2="1"', [[0, '#fff6b0'], [.45, '#ffd23f'], [1, '#f2a100']])
      : acc === 'wings' ? grad('linear', id + 'w', 'x1="0" y1="0" x2="1" y2="1"', [[0, '#ffffff'], [1, '#cfeaff']]) + grad('linear', id + 'x', 'x1="0" y1="0" x2="1" y2="1"', [[0, '#eef8ff'], [1, '#b4dcfb']]) : '';
  }
  var api = { assetRoot: '' };
  function em(ch, x, y, size, cls) {
    if (!ch) return '';
    var cp = Array.from(ch).map(function (c) { return c.codePointAt(0).toString(16); }).filter(function (c) { return c !== 'fe0f'; }).join('-');
    return '<image class="em' + (cls || '') + '" href="' + api.assetRoot + 'assets/ico/' + cp + '.png" x="' + n1(x - size / 2) + '" y="' + n1(y - size * 0.9) + '" width="' + size + '" height="' + size + '"/>';
  }

  // ---------- expressions: every mood is a row of parameters for the one drawing ----------
  // eye: open | joy (closed, laughing) | wide      look: [x, y] -1..1       lid / lidB: share of the eye covered from above / below
  // brow: [heightL, slantL, heightR, slantR]  (height: minus = up; slant: plus = inner end up, kind or worried; minus = inner end down, concentrating)
  // mouth: smile | grin | o | bigO | small | tongue | wide | wobble | frown | open | yawn
  // arms: [left, right] of down | up | chin | wave | hips | head | out      tilt: degrees
  var MOODS = {
    happy:     { mouth: 'smile', arms: ['down', 'down'] },
    think:     { look: [.5, -.8], mouth: 'o', arms: ['down', 'chin'], brow: [0, 4, -5, 4] },
    cheer:     { eye: 'joy', mouth: 'grin', arms: ['up', 'up'] },
    sad:       { look: [0, .85], mouth: 'frown', arms: ['down', 'down'], brow: [5, 20, 5, 20], tear: 1 },
    curious:   { look: [-.75, .35], mouth: 'osmall', arms: ['down', 'chin'], brow: [1, 2, -7, 6], tilt: -6 },
    surprised: { eye: 'wide', mouth: 'bigO', arms: ['out', 'out'], brow: [-7, 6, -7, 6] },
    proud:     { look: [.15, -.3], lidB: .24, mouth: 'wide', arms: ['hips', 'hips'], brow: [-3, 5, -3, 5] },
    focused:   { look: [-.7, .75], mouth: 'tongue', arms: ['down', 'down'], brow: [5, -7, 5, -7] },
    sleepy:    { look: [0, .7], lid: .58, mouth: 'yawn', arms: ['down', 'down'], brow: [1, 10, 1, 10], zz: 1 },
    wave:      { mouth: 'open', arms: ['down', 'wave'], brow: [-3, 5, -3, 5] },
    oops:      { look: [.55, -.45], mouth: 'wobble', arms: ['down', 'head'], brow: [0, 13, -2, 13], blush: 1 }
  };
  var ALIAS = { waving: 'wave' };
  // a left arm: start x, y, control dx, dy, end dx, dy (the right arm is its mirror); the last number 1 = drawn in front of the body
  var ARMS = {
    down: [44, 188, -18, 16, -10, 40],
    up:   [50, 180, -28, -16, -24, -56],
    chin: [37, 200, -8, 30, 30, 10, 1],
    wave: [48, 186, -32, -8, -31, -54],
    hips: [46, 184, -32, 10, -7, 38],
    head: [48, 186, -38, -8, -19, -58],
    out:  [44, 196, -18, 4, -31, -12]
  };
  function arm(pose, right, cls, col, lv, big, ol) {
    var a = ARMS[pose] || ARMS.down, k = right ? -1 : 1, sx = right ? 200 - a[0] : a[0], ex = sx + k * a[4], ey = a[1] + a[5];
    var d = 'M' + sx + ',' + a[1] + ' q' + k * a[2] + ',' + a[3] + ' ' + k * a[4] + ',' + a[5];
    if (!big && !ol) return { s: '<path class="arm ' + cls + '" fill="none" stroke-linecap="round" stroke-width="15" stroke="' + col + '" d="' + d + '"/>', front: !!a[6], ex: ex, ey: ey };
    var s = '<g class="arm ' + cls + '" fill="none" stroke-linecap="round" stroke-width="15" stroke="' + col + '">' +
      (ol ? '<path d="' + d + '" stroke="' + ol + '" stroke-width="' + (big ? 20 : 21) + '"/>' + (big ? '<path d="M' + ex + ',' + ey + 'h0" stroke="' + ol + '" stroke-width="24"/>' : '') : '') +
      '<path d="' + d + '"/>' + (big ? '<path d="M' + ex + ',' + ey + 'h0" stroke-width="19"/>' : '') + '</g>';
    return { s: s, front: !!a[6], ex: ex, ey: ey };
  }
  function mouthOf(type, big) {

  if (row.hasAttribute('data-m')) play(row); else row.innerHTML = row.innerHTML;
});
[].forEach.call(document.querySelectorAll('[data-fa] svg.troll'), function (sv) { sv.setAttribute('data-act', sv.closest('[data-fa]').getAttribute('data-fa')); });
if (sec === 'frames') setTimeout(function () {
  document.getAnimations().forEach(function (a) { try { var el = a.effect.target.closest('[data-ft]'); if (el) { a.pause(); a.currentTime = +el.getAttribute('data-ft'); } } catch (e) {} });
  document.title = 'FRAMES';
}, 60);
// still frames: #t=250 pauses every animation at 250 ms from its start
var at = /[#&]t=(\d+)/.exec(hash);
if (at) setTimeout(function () { document.getAnimations().forEach(function (a) { try { a.pause(); a.currentTime = +at[1]; } catch (e) {} }); document.title = 'FROZEN ' + at[1]; }, 60);
addEventListener('hashchange', function () { location.reload(); });
</script>
