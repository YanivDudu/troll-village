<!-- End-to-end check of the family account (e-mail sign-in) and of the sync by a running number, against the real cloud.
     Run: node tests/run-page.js tests/sync.html 300   (or python -m http.server 8765 in the project root, then open
     http://localhost:8765/tests/sync.html). Plays two devices by swapping localStorage; "another device" is also played by
     writing straight into the test family's own document. Expects title "SYNC OK".
     The test makes one throw-away account and reads and writes only that account's own document (families/<its uid>); its
     players are local players, so nothing of them goes to the ranking. The account is deleted at the end, also after a
     failure or when the time runs out. -->

// Every request of the game page to Firestore goes through here: the test sees it, can hold it, or can cut the network.

}
// Opens the game. The watcher is put in before the script of the page runs, so the sync of the page load is seen too.
function open(hash) {
  alive();

    f.onload = null; f.src = 'about:blank';

      ch.port1.onmessage = function () { if (!on || hooked) return; tryHook(); if (!hooked) ch.port2.postMessage(0); };

}
async function openS(hash) { var i = net.log.length; await open(hash); await idle(i); } // a linked device: the page and its first sync

function sync() { return JSON.parse(localStorage.getItem('trollVillage.sync') || '{}'); }

function st(id) { return JSON.parse(localStorage.getItem('trollVillage.r.' + id)); }

var KEY = 'AIzaSyDbPSLMpo4Zqdey6NgQwzzCty6t9FCg0-0', mail = 'zz-test-' + Date.now() + '@example.com', pw = 'pw' + Date.now(), uid = '', tok = '';

function post(url, body) { return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }

  await until(function () { return profs().list.length === 2 && sync().code === 'acct'; }, 'signed in on the cleared device');
  await idle(i0);
  var after6 = await cloudRaw();
  check(localStorage.getItem('trollVillage.r.' + idA) === before6.fields['s3_' + idA].stringValue && localStorage.getItem('trollVillage.r.' + idB) === before6.fields['s3_' + idB].stringValue, 'storage cleared: the players and their progress came back from the cloud');
  check(rev(idA) === n5, 'storage cleared: the device holds the number of the cloud copy (' + rev(idA) + ', expected ' + n5 + ')');
