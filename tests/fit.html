<!DOCTYPE html>
<meta charset="utf-8">
<title>running</title>
<!-- Layout check: loads every screen at phone / tablet / laptop sizes and reports overflow.
     Usage: fit.html            -> all sizes, result in document.title + table
            fit.html#390x800    -> only that size (handy for screenshots) -->
<style>body{margin:8px;font:13px sans-serif;background:#333;color:#fff}iframe{border:2px solid #000;margin:4px;background:#fff}td,th{padding:2px 8px;border:1px solid #777}.bad{background:#a00}</style>
<div id="frames"></div><table id="out"></table>
<script>
var SIZES = [[360, 640], [390, 800], [800, 380], [768, 1024], [1024, 768], [1280, 620], [1366, 650], [1920, 950]];
var SCREENS = ['home', 'topics', 'topics&ch', 'topics&g=3', 'topics&g=4&ch', 'region&g=4&t=g5dec', 'region&g=1&t=g1a', 'round', 'round&t=ord&l=4', 'round&t=num&l=7', 'round&t=add&l=7&fmt=tf', 'round&t=add&l=7&fmt=cmp', 'round&t=add&l=7&fmt=line', 'round&t=add&l=7&fmt=word', 'round&t=add&l=7&fmt=use', 'round&t=add&l=7&fmt=pairs', 'round&t=mul&l=5&fmt=array', 'round&t=mul&l=1&fmt=array', 'round&t=num&l=6&fmt=build', 'round&t=num&l=7&fmt=build', 'end&hatch&t=add', 'end&t=mul', 'bossend&t=add', 'region&t=mul', 'region&t=add', 'region&t=frac', 'region&t=ord', 'dress', 'dress&tab=7', 'who', 'who&linked', 'cloud', 'cloud&linked', 'gift',
  'hint&step=last&t=add&l=5', 'hint&step=last&t=add&l=7', 'hint&step=last&t=add&l=10', 'hint&step=last&t=sub&l=7', 'hint&step=last&t=sub&l=10', 'hint&step=last&t=mul&l=1', 'hint&step=last&t=mul&l=5', 'hint&step=last&t=mul&l=8',
  'hint&step=last&t=div&l=1', 'hint&step=last&t=div&l=6', 'hint&step=last&t=num&l=4', 'hint&step=last&t=num&l=6', 'hint&step=last&t=num&l=8', 'hint&step=last&t=frac&l=4', 'hint&step=last&t=ord&l=4', 'hint&step=last&t=miss&l=5',
  // grade 1
  'topics&g=1', 'round&g=1&t=num&l=1&say=1', 'round&say=1', 'hint&step=last&g=1&t=num&l=1&say=1', 'region&g=1&t=add', 'region&g=1&t=num', 'round&g=1&t=add&l=1', 'round&g=1&t=num&l=2', 'hint&step=last&g=1&t=add&l=1', 'hint&step=last&g=1&t=add&l=3', 'hint&step=last&g=1&t=add&l=4', 'hint&step=last&g=1&t=sub&l=3', 'hint&step=last&g=1&t=num&l=1', 'hint&step=last&g=1&t=miss&l=1',
  // grade 4
  'topics&g=4', 'region&g=4&t=mul', 'region&g=4&t=frac', 'region&g=3&t=div', 'round&g=4&t=frac&l=6', 'round&g=4&t=frac&l=7', 'round&g=4&t=sub&l=13', 'round&g=4&t=add&l=13', 'hint&step=last&g=4&t=add&l=13', 'hint&step=last&g=4&t=sub&l=13', 'hint&step=last&g=4&t=mul&l=11', 'hint&step=last&g=4&t=mul&l=9',
  'hint&step=last&g=4&t=div&l=10', 'hint&step=last&g=4&t=num&l=9', 'hint&step=last&g=4&t=num&l=10', 'hint&step=last&g=4&t=num&l=12', 'hint&step=last&g=4&t=frac&l=5', 'hint&step=last&g=4&t=frac&l=6', 'hint&step=last&g=4&t=frac&l=7', 'hint&step=last&g=4&t=frac&l=8', 'hint&step=last&g=4&t=miss&l=10',
  // grade 5 challenge
  'region&g=4&t=num', 'region&g=4&t=add', 'round&g=4&t=add&l=16', 'round&g=4&t=frac&l=10', 'round&g=4&t=mul&l=12', 'round&g=4&t=num&l=14', 'hint&step=last&g=4&t=add&l=16', 'hint&step=last&g=4&t=sub&l=14', 'hint&step=last&g=4&t=mul&l=12', 'hint&step=last&g=4&t=div&l=12', 'hint&step=last&g=4&t=num&l=13', 'hint&step=last&g=4&t=num&l=14', 'hint&step=last&g=4&t=num&l=15', 'hint&step=last&g=4&t=frac&l=9', 'hint&step=last&g=4&t=frac&l=10', 'hint&step=last&g=4&t=frac&l=11', 'hint&step=last&g=4&t=miss&l=11'];
// race: button on the home screen, pool, invitation bar, track, launch, results
SCREENS = SCREENS.concat(['home&rbtn=1', 'home&pool=1', 'round&inv=1', 'topics&inv=1', 'round&race=1', 'round&race=1&say=1', 'round&g=1&t=num&l=1&race=1', 'hint&step=last&t=add&l=7&race=1', 'region&race=1', 'topics&race=1', 'round&race=1&launch=1', 'round&podium=1', 'round&podium=2']);
var only = /(\d+)x(\d+)/.exec(location.hash);
if (only) SIZES = [[+only[1], +only[2]]];
var want = SIZES.length * SCREENS.length, got = 0, fails = [];
SIZES.forEach(function (s) {
  SCREENS.forEach(function (sc) {
    var f = document.createElement('iframe');
    f.width = s[0]; f.height = s[1];
    f.src = '../index.html#demo&fit&s=' + sc;
    document.getElementById('frames').appendChild(f);
  });
});
addEventListener('message', function (e) {
  var d = e.data; if (!d || !d.id) return;
  got++;
  var bad = d.oh > 1 || d.ow > 1 || d.off > 0 || d.nav < 1 || d.ovf > 1 || (/hint/.test(d.id) && !d.card);
  if (bad) fails.push(d.w + 'x' + d.h + ' ' + d.id.replace('#demo&fit&s=', '') + ' oh=' + d.oh + ' ow=' + d.ow + ' off=' + d.off + ' nav=' + d.nav + ' ovf=' + d.ovf + ' card=' + d.card);
  var tr = document.createElement('tr'); if (bad) tr.className = 'bad';
  tr.innerHTML = '<td>' + d.w + 'x' + d.h + '</td><td>' + d.id + '</td><td>overflow-y ' + d.oh + '</td><td>overflow-x ' + d.ow + '</td><td>off-screen buttons ' + d.off + '</td><td>nav buttons ' + d.nav + '</td>';
  document.getElementById('out').appendChild(tr);
  if (got === want) document.title = 'FIT ' + (fails.length ? 'FAIL ' + fails.join(' | ') : 'OK ' + got);
});
</script>
