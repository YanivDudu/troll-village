<meta charset="utf-8">
<title>running</title>
<!-- Layout check: loads every screen at phone / tablet / laptop sizes and reports overflow.

// the big button of the home screen (the next step): new player, in the middle of a house, bridge ready, everything done; grades 1 and 4; a boy; the parents' panel

// the topic screen as a treasure map: 4 houses, 9 houses, a new player, a finished topic with the bridge done, bridge ready, the three stages of a house open, a boy, a map of the next grade, night
SCREENS = SCREENS.concat(['region&t=add&nh=9', 'region&t=add&home=new', 'region&t=add&home=done', 'region&t=add&home=bridge', 'region&t=add&open=1', 'region&g=4&t=frac&open=1', 'region&g=1&t=add&open=1', 'region&t=geo2poly&open=1&boy=1', 'region&g=3&t=g4frac&open=1', 'region&g=4&t=frac&nh=9&home=done', 'region&t=add&open=1&hour=21', 'region&t=add&home=done&hour=21', 'region&t=add&nh=9&race=1']);
// the journey world: the camp (home) with many trolls, a new player, a boy, dusk and night; the world map of every subject and grade, the challenge map, the gate locked and open, everything finished; the four lands
SCREENS = SCREENS.concat(['home&many=1', 'home&many=1&rbtn=1', 'home&many=1&hour=21', 'home&g=1&home=new&boy=1', 'home&home=new&hour=21', 'home&hour=18', 'home&g=3&many=1&home=done', 'home&many=1&inv=1', 'home&many=1&race=1', 'topics&home=new', 'topics&home=done', 'topics&home=mid&boy=1', 'topics&hour=21', 'topics&ch&hour=21', 'topics&g=1&ch', 'topics&g=3&ch', 'topics&sub=geo', 'topics&sub=heb', 'topics&sub=eng', 'topics&sub=geo&g=1', 'topics&sub=heb&g=1', 'topics&sub=eng&g=1', 'topics&sub=geo&g=3', 'topics&sub=heb&g=3', 'topics&sub=eng&g=3', 'topics&sub=geo&g=4', 'topics&sub=heb&g=4', 'topics&sub=eng&g=4', 'topics&sub=geo&g=4&ch', 'topics&sub=heb&g=2&ch', 'topics&sub=eng&g=3&ch&race=1', 'topics&g=3&home=done&inv=1', 'subjects&g=3', 'subjects&g=4', 'subjects&boy=1', 'subjects&hour=18', 'subjects&hour=21', 'subjects&home=new', 'subjects&home=done', 'subjects&race=1', 'subjects&inv=1']);
// the reward moment on the journey map, by day, at dusk and at night: a stage that ends with 1, 2 and 3 stars, a finished house (the egg waiting, the egg hatched),
// a new house opened, the last house of a topic (bridge ready), the end of a bridge mission, the end of a mixed round; grades 1 and 4; a boy; a new player; other subjects
['end&stg=0&stars=1', 'end&stg=1&stars=2', 'end&stg=1', 'end&egg', 'end&hatch', 'end&hatch&fin=1', 'end&home=bridge', 'bossend', 'mixend', 'mixend&hatch'].forEach(function (sc) { SCREENS.push(sc, sc + '&hour=18', sc + '&hour=21'); });

  'end&hatch&boy=1', 'end&egg&boy=1&hour=21', 'end&stg=0&stars=1&boy=1', 'bossend&boy=1', 'bossend&g=3&boy=1&hour=21', 'mixend&hatch&boy=1', 'end&home=new&stg=0', 'end&home=new&stg=0&g=1&hour=21', 'end&t=geo2poly&hatch', 'end&g=3&t=eng3listen&stg=1&stars=2', 'end&g=4&t=heb4read&hatch&hour=21', 'end&g=4&t=g5dec&stg=1&stars=2', 'bossend&t=mul&g=3', 'end&stg=1&say=1']);
var only = /(\d+)x(\d+)/.exec(location.hash);
if (only) SIZES = [[+only[1], +only[2]]];
var sky = /sky=(\d+)/.exec(location.hash);
if (sky) SCREENS = SCREENS.filter(function (sc, i) { return !/hour=/.test(sc) && SCREENS.indexOf(sc) === i; }).map(function (sc) { return sc + '&hour=' + sky[1]; });
var pick = /only=([^&]+)/.exec(location.hash); // fit.html#360x640&only=race -> just the screens whose name contains that text
if (pick) SCREENS = SCREENS.filter(function (sc) { return sc.indexOf(decodeURIComponent(pick[1])) >= 0; });
var small = 0, loops = 0;
var want = SIZES.length * SCREENS.length, got = 0, fails = [];
SIZES.forEach(function (s) {
  SCREENS.forEach(function (sc) {
    var f = document.createElement('iframe');
    f.width = s[0]; f.height = s[1];
    f.src = '../index.html#demo&fit&s=' + sc;
    document.getElementById('frames').appendChild(f);
  });
});
addEventListener('message', function (e) {
  var d = e.data; if (!d || !d.id) return;
  got++; small += d.sm || 0; loops += d.inf || 0;
  var bad = d.oh > 1 || d.ow > 1 || d.off > 0 || d.nav < 1 || d.ovf > 1 || (/hint/.test(d.id) && !d.card);
  if (bad) fails.push(d.w + 'x' + d.h + ' ' + d.id.replace('#demo&fit&s=', '') + ' oh=' + d.oh + ' ow=' + d.ow + ' off=' + d.off + ' nav=' + d.nav + ' ovf=' + d.ovf + ' card=' + d.card);
  var tr = document.createElement('tr'); if (bad) tr.className = 'bad';
  tr.innerHTML = '<td>' + d.w + 'x' + d.h + '</td><td>' + d.id + '</td><td>overflow-y ' + d.oh + '</td><td>overflow-x ' + d.ow + '</td><td>off-screen buttons ' + d.off + '</td><td>nav buttons ' + d.nav + '</td>';
  document.getElementById('out').appendChild(tr);
  if (got === want) document.title = 'FIT ' + (fails.length ? 'FAIL ' + fails.join(' | ') : 'OK ' + got + ' small=' + small + ' loops=' + loops);
});
</script>
