     Every run makes TWO village documents (their codes are printed in the log; the rules allow no delete, so the test empties
     them at the end and they stay, empty) and one throw-away family account, which is deleted at the end. The test players
     are local players: nothing of them goes to the ranking or to the list of who is online. One line of the ranking is written
     by the test itself under a made-up race identity, to see that the game removes it; the test removes it too, whatever happens.
     tests/autolink.html?local runs only the part without a network (old devices are moved to lasting ids): no document is made. -->

  finally {
    dead = true; f.onload = null; f.src = 'about:blank'; net.offline = false;
    await new Promise(function (r) { setTimeout(r, 1500); }); // a page that closes may still push
    try { await fetch(RT + 'board/' + RID + '.json', { method: 'DELETE' }); } catch (e) {}
    for (var i = 0; i < made.length; i++) { // the rules allow no delete of a village: the two of this run are emptied and stay
      try { var keys = Object.keys((await village(made[i])) || {}); if (keys.length) await empty(vurl(made[i]), keys); say('village ' + made[i] + ' of this run: ' + (keys.length ? 'emptied (' + keys.length + ' fields)' : 'was never written')); } catch (e) { say('cleanup of ' + made[i] + ': ' + e); }
    }
    try {
      var tk = await (await post(IDT + 'signInWithPassword?key=' + KEY, { email: mail, password: pw, returnSecureToken: true })).json();
      if (tk.idToken) {
        uid = tk.localId; tok = tk.idToken;
        try { var fk = Object.keys(await family()); if (fk.length) await empty(FS + 'families/' + uid + '?key=' + KEY, fk, { Authorization: 'Bearer ' + tok }); } catch (e) {}
        var gone = await post(IDT + 'delete?key=' + KEY, { idToken: tk.idToken });
        say((gone.ok ? 'ok' : 'NOT DONE') + ' the test account was deleted (http ' + gone.status + ')');
        if (!gone.ok && title === 'AUTOLINK OK') title = 'AUTOLINK FAIL the test account was not deleted';
      } else say('no test account to delete (' + ((tk.error && tk.error.message) || '?') + ')');
    } catch (e) { say('cleanup: ' + e); if (title === 'AUTOLINK OK') title = 'AUTOLINK FAIL cleanup ' + e.message; }
    restore(keep);
  }
  say('took ' + Math.round((Date.now() - T0) / 1000) + ' s');
  document.title = title;
  fetch('/__report', { method: 'POST', body: document.title + String.fromCharCode(10) + log.textContent }).catch(function () {});
})();
</script>
