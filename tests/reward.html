<!DOCTYPE html>
<meta charset="utf-8">
<title>running</title>
<!-- The reward moment of the end screens (end of a stage, of a mixed round, of a bridge mission):
     nothing can be tapped during the first 0.9 s, after that one tap skips to the final state, and then the buttons work;
     left alone, the show ends by itself. Result in document.title: REWARD OK n / REWARD FAIL ...
     Run: msedge --headless --disable-gpu --allow-file-access-from-files --virtual-time-budget=40000 --dump-dom tests/reward.html -->
<style>body{margin:8px;font:13px sans-serif;background:#333;color:#fff}iframe{border:2px solid #000;margin:4px;background:#fff}</style>
<div id="frames"></div><pre id="out"></pre>
<script>
var fails = [], checks = 0;
function check(ok, what) { checks++; if (!ok) fails.push(what); document.getElementById('out').textContent += (ok ? 'ok   ' : 'FAIL ') + what + '\n'; }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function frame(hash) {
  return new Promise(function (res) {
    var f = document.createElement('iframe'); f.width = 390; f.height = 800; f.src = '../index.html#' + hash + (/skin=toy/.test(location.hash) ? '&skin=toy' : ''); // reward.html#skin=toy runs the same checks in the toy skin
    document.getElementById('frames').appendChild(f);
    (function poll() { var d = f.contentDocument, s = d && d.querySelector('.screen.endm'); if (s) res({ f: f, d: d, s: s }); else setTimeout(poll, 20); })();
  });
}
function num(x) { return +(/\d+/.exec(x.d.querySelector('.coinchip').textContent) || [0])[0]; }
function tappable(x, b) { var r = b.getBoundingClientRect(), t = x.d.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); return !!t && (t === b || b.contains(t)); }
async function one(hash, coins) {
  // tapped: blocked at first, then one tap skips, then the button of the next step starts an exercise
  var x = await frame(hash + '&show=1'), nxt = x.d.querySelector('.ebtns .nxt'), before = num(x);
  check(!!nxt, hash + ': a primary button');
  check(x.d.querySelectorAll('.ebtns .nxt').length === 1, hash + ': exactly one primary button');
  nxt.click();
  check(x.d.querySelector('.screen.endm') === x.s && !x.s.classList.contains('fin'), hash + ': a tap in the first moment does nothing');
  await wait(1000);
  x.s.querySelector('.eframe').click();
  check(x.s.classList.contains('fin'), hash + ': a tap after one second skips to the final state');
  check(num(x) === before + coins, hash + ': the coin counter went up by ' + coins + ' (' + before + ' -> ' + num(x) + ')');
  check(tappable(x, nxt), hash + ': the primary button is on top');
  nxt.click(); await wait(600);
  check(!!x.d.querySelector('.answers,.qrow') || !x.d.querySelector('.screen.endm:not(.out)'), hash + ': the primary button leads on');
  x.f.remove();
  // left alone: the show ends by itself with the same final state
  var y = await frame(hash + '&show=1');
  check(!y.s.classList.contains('fin'), hash + ': the show runs at first');
  await wait(3200);
  check(y.s.classList.contains('fin') && num(y) === before + coins, hash + ': the show ends by itself');
  [].forEach.call(y.d.querySelectorAll('.ebtns .btn'), function (b) { check(tappable(y, b), hash + ': button on top: ' + b.textContent); });
  y.f.remove();
}
async function egg(hash) { // an egg: tap it after the show, the new troll stands there with its name, then the buttons come
  var x = await frame(hash + '&show=1');
  await wait(3200);
  var e = x.d.querySelector('.emeet .egg');
  check(!!e && !x.d.querySelector('.ebtns .btn'), hash + ': an egg, and no buttons before it is tapped');
  e.dispatchEvent(new Event('click')); await wait(1200);
  check(!!x.d.querySelector('.emeet .reveal svg') && !!x.d.querySelector('.emeet .mlab').textContent, hash + ': the new troll with its name');
  check(x.d.querySelectorAll('.ebtns .nxt').length === 1, hash + ': one primary button after the egg');
  x.f.remove();
}
async function goal() { // the savings goal: a meter on the end screen; when the coins are enough the cart is offered once, as a small button, never as the primary one
  var x = await frame('demo&s=end&stg=1&stars=2&goal=dragon&hour=10');
  check(!!x.d.querySelector('.ecaps .egoal .gnum') && !x.d.querySelector('.ebtns .cartb'), 'goal not reached: a meter, and no offer');
  x.f.remove();
  x = await frame('demo&s=end&stg=1&stars=2&goal=ball&fx=spin.pfire&hour=21');
  var c = x.d.querySelectorAll('.ebtns .cartb'), all = x.d.querySelectorAll('.ebtns .btn');
  check(c.length === 1 && !c[0].classList.contains('nxt') && x.d.querySelectorAll('.ebtns .nxt').length === 1 && all[0] !== c[0] && all[0].classList.contains('nxt'), 'goal reached: the cart is one small button, after the primary one');
  check(tappable(x, c[0]) && tappable(x, all[0]), 'goal reached: the buttons are on top');
  c[0].click(); await wait(500);
  var k = x.d.querySelector('.screen.cart:not(.out) .citem.pick'), b = x.d.querySelector('.screen.cart:not(.out) .cbtn');
  check(!!k && k.getAttribute('data-v') === 'ball' && !!b, 'the cart opens on the item of the goal, with its one button');
  if (b) b.click(); await wait(300);
  k = x.d.querySelector('.screen.cart:not(.out) .citem.pick .cpr');
  check(!!k && /שֶׁלִּי/.test(k.textContent), 'the item of the goal is bought');
  x.f.remove();
}
// task "flowfix-end": what is new on the end screen. The new troll with a t-shirt opens the dressing room on THAT troll (first in the strip); the trophy with
// the new stamp or postcard opens the journal on that item with a ring around it; the journal button of the camp counts what was not looked at, and looking clears it
async function news() {
  var x = await frame('demo&s=end&hatch&hour=10'); await wait(1500);
  var d = x.d.querySelector('.ebtns .dressn'), a = x.d.querySelector('.ebtns .achb'), all = x.d.querySelectorAll('.ebtns .btn'), name = x.d.querySelector('.emeet .mlab').textContent;
  check(!!d && !!a && !!d.querySelector('.npic svg') && !!d.querySelector('.ic-shirt') && !!a.querySelector('.ic-trophy') && !!a.querySelector('.npic img'), 'a finished house: the new troll with a t-shirt, and the trophy with the new stamp');
  check(x.d.querySelectorAll('.ebtns .nxt').length === 1 && all[0].classList.contains('nxt') && tappable(x, all[0]) && tappable(x, d) && tappable(x, a), 'the main button stays first and alone; the two picture buttons can be tapped');
  d.click(); await wait(600);
  var cs = x.d.querySelector('.screen.cart:not(.out)'), th = cs && cs.querySelector('.cth.on'), any = cs && cs.querySelector('.cth');
  check(!!cs && cs.querySelector('.cname').textContent === name && (!any || (!!th && th.getAttribute('aria-label') === name)), 'the t-shirt opens the dressing room on the new troll, which is on the page of the strip that is shown (' + name + ')');
  x.f.remove();
  x = await frame('demo&s=end&hatch&hour=21'); await wait(1500);
  a = x.d.querySelector('.ebtns .achb'); var key = a.getAttribute('data-key'); a.click(); await wait(600);
  var js = x.d.querySelector('.screen.jrn:not(.out)'), hot = js ? js.querySelectorAll('.jpage .jhot') : [];
  check(hot.length === 1 && hot[0].getAttribute('data-key') === key && /^h:/.test(key), 'the trophy opens the journal on the page of the new stamp, with a ring around it (' + key + ')');
  x.d.querySelector('.top .tgroup button:last-child, .top button[aria-label="חֲזָרָה לַכְּפָר"]').click(); await wait(600);
  x.f.remove();
  // a rescue, and straight to the camp: the journal button counts the postcard; a tap opens the journal on it; back in the camp the count is gone
  x = await frame('demo&s=bossend&hour=10'); await wait(300);
  check(!!x.d.querySelector('.ebtns .dressn') && /^b:/.test((x.d.querySelector('.ebtns .achb') || x.d.body).getAttribute('data-key') || ''), 'a rescue: the rescued troll with a t-shirt, and the trophy with the postcard');
  x.d.querySelector('.top button[aria-label="חֲזָרָה לַכְּפָר"]').click(); await wait(600);
  var jb = x.d.querySelector('.screen.camp:not(.out) .jrnb'), bd = jb && jb.querySelector('.jbadge');
  check(!!jb && !!jb.querySelector('.ic-trophy') && !!bd && bd.textContent === '1', 'the camp: a trophy on the journal button, with the number 1');
  jb.click(); await wait(600);
  hot = x.d.querySelectorAll('.screen.jrn:not(.out) .jpage .jcard.jhot');
  check(hot.length === 1, 'the journal opens on the new postcard, with a ring around it');
  x.d.querySelector('.top button[aria-label="חֲזָרָה לַכְּפָר"]').click(); await wait(600);
  jb = x.d.querySelector('.screen.camp:not(.out) .jrnb');
  check(!!jb && !jb.querySelector('.jbadge'), 'after the journal was opened the number is gone');
  jb.click(); await wait(600);
  check(!x.d.querySelector('.screen.jrn:not(.out) .jhot'), 'and the ring is not shown again');
  x.f.remove();
  // task "rounds": a round that brings the badge of the house to a new look (round 5: the medal) is an achievement: the badge pops in the picture, a caption
  // says it, and the trophy button opens the journal on the stamp of that house, with a ring around it
  x = await frame('demo&s=end&rn=5&hour=10'); await wait(300);
  a = x.d.querySelector('.ebtns .achb'); var bdg = x.d.querySelector('.eframe .mnode[data-n="5"] .hbadge.a5'), key5 = a ? a.getAttribute('data-key') : '';
  check(!!bdg && bdg.getAttribute('data-n') === '5' && bdg.classList.contains('eup') && !!x.d.querySelector('.ecaps .ebadge'), 'round 5 of a house: its badge shows 5 in the look of the fifth round, and a caption says so');
  check(!!a && /^h:.*:5$/.test(key5) && !!a.querySelector('.hbadge.a5') && !x.d.querySelector('.ebtns .dressn') && x.d.querySelectorAll('.ebtns .nxt').length === 1, 'the new look is an achievement: the trophy button with that badge (' + key5 + '), no new troll, one main button');
  if (a) { a.click(); await wait(600); hot = x.d.querySelectorAll('.screen.jrn:not(.out) .jpage .jhot'); check(hot.length === 1 && hot[0].getAttribute('data-key') === key5 && !!hot[0].querySelector('.hbadge.a5'), 'the journal opens on the stamp of that house, with its badge and a ring around it'); }
  x.f.remove();
  // a round that was not won (one star): it counts and is rewarded, nothing opens, and the main button offers one more round or the next step
  x = await frame('demo&s=end&rn=3&stg=1&egg&stars=1&hour=10'); await wait(300);
  check(!!x.d.querySelector('.eframe .hbadge.a3') && !x.d.querySelector('.emeet') && x.d.querySelectorAll('.ebtns .nxt').length === 1 && x.d.querySelectorAll('.bigstars .star.on').length === 1, 'a round that was not won: one star, the badge counts it, no egg, one main button');
  x.f.remove();
  // a round that changes nothing but the count: no picture buttons; a mixed round: only the new troll
  x = await frame('demo&s=end&stg=1&stars=2&hour=10'); await wait(300);
  check(!x.d.querySelector('.ebtns .newb') && !!x.d.querySelector('.ebtns .nxt'), 'a stage in the middle of a house: nothing new, no picture buttons');
  x.f.remove();
  x = await frame('demo&s=mixend&hatch&hour=10'); await wait(1500);
  check(!!x.d.querySelector('.ebtns .dressn') && !x.d.querySelector('.ebtns .achb') && x.d.querySelectorAll('.ebtns .cartb').length === 1, 'a mixed round: the new troll with a t-shirt, no trophy, the cart');
  x.f.remove();
}
(async function () {
  try {
    await goal();
    await news();
    await one('demo&s=end&stg=1&stars=2&hour=21', 14);
    await one('demo&s=end&stg=0&stars=1&hour=18', 8);
    await one('demo&s=end&stg=0&g=4&hour=10', 22);
    await one('demo&s=bossend&hour=21', 30);
    await one('demo&s=bossend&g=1&boy=1&hour=10', 30);
    await egg('demo&s=end&egg&hour=21');
    await egg('demo&s=mixend&g=1&hour=21');
    await egg('demo&s=end&home=new&stg=0&g=1&hour=10');
  } catch (e) { fails.push('error ' + e.message); }
  document.title = fails.length ? 'REWARD FAIL ' + fails.join(' | ') : 'REWARD OK ' + checks;
})();
</script>
